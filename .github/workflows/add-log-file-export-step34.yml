name: Add Log File Export Step 34

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - "tools/refactor/add_log_file_export_step34.py"
      - ".github/workflows/add-log-file-export-step34.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[step34-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Capture starting branch head
        shell: bash
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply explicit log file export
        shell: bash
        run: |
          set -euo pipefail
          # The viewer already observes GlobalLog in memory; remove an overly
          # broad safety assertion from the one-shot patch script. Disk writing
          # remains exclusively inside the CreateDocument result callback.
          sed -i "/assert 'GlobalLog.logs.collect' not in updated/d" tools/refactor/add_log_file_export_step34.py
          python3 tools/refactor/add_log_file_export_step34.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ActivityResultContracts.CreateDocument("text/plain")' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/DebugSettings.kt
          grep -q 'saveLogsLauncher.launch("capsule-logs-$fileStamp.txt")' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/DebugSettings.kt
          grep -q 'contentResolver.openOutputStream(uri)' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/DebugSettings.kt
          grep -q 'save_logs_to_file' app/src/main/res/values/capsule_log_export_strings.xml
          grep -q 'Сохранить логи в файл' app/src/main/res/values-ru/capsule_log_export_strings.xml
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/DebugSettings.kt').read_text()
          assert text.count('contentResolver.openOutputStream(uri)') == 1
          assert 'FileOutputStream' not in text
          assert 'ActivityResultContracts.CreateDocument("text/plain")' in text
          assert 'saveLogsLauncher.launch("capsule-logs-$fileStamp.txt")' in text
          PY

      - name: Run full validation
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-log-file-export-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          REMOTE_SHA="$(git rev-parse origin/cleanup/capsule-player-only)"
          if [ "$REMOTE_SHA" != "$START_SHA" ]; then
            echo "Branch moved during validation: start=$START_SHA remote=$REMOTE_SHA" >&2
            exit 1
          fi

      - name: Commit validated export and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm tools/refactor/add_log_file_export_step34.py
          rm .github/workflows/add-log-file-export-step34.yml
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add explicit debug log file export [step34-final]"
          git push origin HEAD:cleanup/capsule-player-only

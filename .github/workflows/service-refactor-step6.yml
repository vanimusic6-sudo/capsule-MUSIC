name: Service Refactor Step 6

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/service-refactor-step6.yml"
      - "tools/refactor/extract_together_runtime.py"
      - "app/src/main/kotlin/com/nikhil/yt/together/TogetherSessionRuntime.kt"
      - "app/src/test/kotlin/com/nikhil/yt/together/TogetherSessionRuntimeTest.kt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-refactor-step6
  cancel-in-progress: false

jobs:
  integrate:
    name: Extract Together session runtime ownership
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Verify Together runtime extraction preconditions
        run: python3 tools/refactor/extract_together_runtime.py --check

      - name: Extract Together runtime ownership
        run: python3 tools/refactor/extract_together_runtime.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only)"
          test "$changed" = "$SERVICE"

          grep -Fq 'import com.nikhil.yt.together.TogetherSessionRuntime' "$SERVICE"
          grep -Fq 'private val togetherRuntime =' "$SERVICE"
          grep -Fq 'val togetherSessionState = togetherRuntime.sessionState' "$SERVICE"
          grep -Fq 'togetherRuntime.stopConnections()' "$SERVICE"
          grep -Fq 'togetherRuntime.beginRemoteApply(android.os.SystemClock.elapsedRealtime())' "$SERVICE"
          grep -Fq 'togetherRuntime.finishRemoteApply()' "$SERVICE"

          ! grep -Fq 'private var togetherServer:' "$SERVICE"
          ! grep -Fq 'private var togetherOnlineHost:' "$SERVICE"
          ! grep -Fq 'private var togetherClient:' "$SERVICE"
          ! grep -Fq 'private var togetherBroadcastJob:' "$SERVICE"
          ! grep -Fq 'private var togetherOnlineConnectJob:' "$SERVICE"
          ! grep -Fq 'private var togetherClientEventsJob:' "$SERVICE"
          ! grep -Fq 'private var togetherHeartbeatJob:' "$SERVICE"
          ! grep -Fq 'private var togetherClock:' "$SERVICE"
          ! grep -Fq 'private var togetherSelfParticipantId:' "$SERVICE"
          ! grep -Fq 'private var togetherApplyingRemote:' "$SERVICE"
          ! grep -Fq 'togetherClient?.disconnect()' "$SERVICE"
          ! grep -Fq 'togetherOnlineHost?.disconnect()' "$SERVICE"
          ! grep -Fq 'togetherServer?.stop()' "$SERVICE"
          git diff --check

      - name: Run unit tests, lint and debug build
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit validated Together runtime extraction
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only)"
          test "$changed" = "$SERVICE"
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$SERVICE"
          git commit -m "Move Together runtime ownership out of MusicService"
          git push origin HEAD:cleanup/capsule-player-only

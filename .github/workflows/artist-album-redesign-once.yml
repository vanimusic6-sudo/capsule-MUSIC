name: Artist album redesign once

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - tools/artist_album_redesign_once.py
      - .github/workflows/artist-album-redesign-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Apply redesign
        run: python3 tools/artist_album_redesign_once.py

      - name: Commit redesign
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "vani-s"
          git config user.email "vanimusic6@gmail.com"
          git add \
            app/src/main/kotlin/com/nikhil/yt/ui/screens/artist/ArtistScreen.kt \
            app/src/main/kotlin/com/nikhil/yt/ui/screens/AlbumScreen.kt \
            app/src/main/kotlin/com/nikhil/yt/ui/component/AlbumLayout.kt \
            app/src/main/kotlin/com/nikhil/yt/ui/component/AlbumArtwork.kt
          git commit -m "Redesign artist and album artwork surfaces"
          git push origin HEAD:cleanup/capsule-player-only

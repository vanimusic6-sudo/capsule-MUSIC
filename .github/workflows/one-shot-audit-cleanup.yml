          # YTPlayerUtils must be genuinely unreachable before deleting it.
          legacy = Path('app/src/main/kotlin/com/nikhil/yt/utils/YTPlayerUtils.kt')
          refs = []
          for base in [Path('app/src/main'), Path('app/src/test')]:
              if not base.exists():

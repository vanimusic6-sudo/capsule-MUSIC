name: Final Formatting Cleanup Step 29

on:
  push:
    branches: [cleanup/capsule-player-only]
    paths: [".github/workflows/final-format-cleanup-step29.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            printf 'unqualifiedResLocale=en-US\n' > app/src/main/res/resources.properties
          fi

      - name: Clean formatting only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt')
          text = path.read_text()

          old_blank = '}\n\n\ninternal fun shouldEnableAudioOffload('
          new_blank = '}\n\ninternal fun shouldEnableAudioOffload('
          if text.count(old_blank) != 1:
              raise SystemExit('helper blank-line anchor changed')
          text = text.replace(old_blank, new_blank, 1)

          old_block = '''    private fun updateAudioOffload(enabled: Boolean) {
              player.setOffloadEnabled(
          shouldEnableAudioOffload(
              requested = enabled,
              crossfadeDurationMs = crossfadeDurationMs.value,
          ),
      )
          }
          '''
          new_block = '''    private fun updateAudioOffload(enabled: Boolean) {
              player.setOffloadEnabled(
                  shouldEnableAudioOffload(
                      requested = enabled,
                      crossfadeDurationMs = crossfadeDurationMs.value,
                  ),
              )
          }
          '''
          if text.count(old_block) != 1:
              raise SystemExit('offload formatting anchor changed')
          text = text.replace(old_block, new_block, 1)
          path.write_text(text)
          PY
          git diff --check

      - name: Compile Kotlin
        run: gradle :app:compileUniversalDebugKotlin --stacktrace --no-daemon

      - name: Refuse stale write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          test "$(git rev-parse origin/cleanup/capsule-player-only)" = "$GITHUB_SHA"

      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          git config user.name capsule-refactor-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/final-format-cleanup-step29.yml
          git add app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          git commit -m 'Polish offload guard formatting'
          git push origin HEAD:cleanup/capsule-player-only

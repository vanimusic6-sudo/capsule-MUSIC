name: CDN Rejected Generation Refresh Step 44

on:
  workflow_dispatch:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - "tools/refactor/cdn_rejected_generation_refresh_step44.py"
      - ".github/workflows/cdn-rejected-generation-refresh-step44.yml"

permissions:
  contents: write

concurrency:
  group: cdn-rejected-generation-step44-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    name: Apply, validate and commit rejected generation refresh
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Capture base head
        shell: bash
        run: echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Apply step44
        run: python3 tools/refactor/cdn_rejected_generation_refresh_step44.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'if (httpStatusCode in REJECTED_SIGNED_URL_STATUS_CODES) return C.TIME_UNSET' app/src/main/kotlin/com/nikhil/yt/playback/CapsuleLoadErrorHandlingPolicy.kt
          grep -F 'SIGNED_URL_REFRESH_DELAY_MS = 250L' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -F 'retryDelayMs = signedUrlRefreshDelayMs(httpStatusCode, retryDelay)' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -F 'refreshCipherConfig = false' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -F 'firstAudio403RejectsCurrentSignedUrlGeneration' app/src/test/kotlin/com/nikhil/yt/playback/CapsuleLoadErrorHandlingPolicyTest.kt

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run full core validation
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-step44-universal-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Refuse stale write
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/cleanup/capsule-player-only | cut -f1)"
          if [ "$REMOTE_HEAD" != "$BASE_HEAD" ]; then
            echo "Branch moved during validation: base=$BASE_HEAD remote=$REMOTE_HEAD"
            exit 1
          fi

      - name: Commit validated step44
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/refactor/cdn_rejected_generation_refresh_step44.py
          rm -f .github/workflows/cdn-rejected-generation-refresh-step44.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh rejected AUDIO CDN generation [step44-final]"
          git push origin HEAD:cleanup/capsule-player-only

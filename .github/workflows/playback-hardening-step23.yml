name: Playback Hardening Step 23

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/playback-hardening-step23.yml"
      - "tools/refactor/harden_forward_seek.py"
      - "app/src/main/kotlin/com/nikhil/yt/playback/ForwardSeekPosition.kt"
      - "app/src/test/kotlin/com/nikhil/yt/playback/ForwardSeekPositionTest.kt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playback-hardening-step23
  cancel-in-progress: false

jobs:
  integrate:
    name: Harden forward seek handling
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Verify forward-seek preconditions
        run: python3 tools/refactor/harden_forward_seek.py --check

      - name: Harden ACTION_FORWARD
        run: python3 tools/refactor/harden_forward_seek.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          TARGET="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only)"
          test "$changed" = "$TARGET"
          grep -Fq 'forwardSeekPositionMs(' "$TARGET"
          grep -Fq 'currentPositionMs = player.currentPosition' "$TARGET"
          grep -Fq 'durationMs = player.duration' "$TARGET"
          ! grep -Fq '(player.currentPosition + 10000).coerceAtMost(player.duration)' "$TARGET"
          grep -Fq 'CapsuleAudioEngine' "$TARGET"
          grep -Fq 'ResolvingDataSource' "$TARGET"
          git diff --check

      - name: Run unit tests, lint and debug build
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit validated forward-seek hardening
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          TARGET="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only)"
          test "$changed" = "$TARGET"
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "Handle unknown duration in forward seek"
          git push origin HEAD:cleanup/capsule-player-only

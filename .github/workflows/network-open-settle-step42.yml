name: Network Open Settling Step 42

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/network-open-settle-step42.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: network-open-settle-step42
  cancel-in-progress: false

jobs:
  harden:
    name: Gate AUDIO network opens before OkHttp
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Capture base head
        shell: bash
        run: echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Apply network-open settling
        run: python3 tools/refactor/network_open_settle_step42.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'suspend fun awaitNetworkOpenStable' app/src/main/kotlin/com/nikhil/yt/playback/PlaybackStabilityGate.kt
          grep -q 'beforeNetworkOpen?.invoke(dataSpec)' app/src/main/kotlin/com/nikhil/yt/playback/audio/AudioNetworkDiagnosticDataSource.kt
          grep -q 'beforeNetworkOpen = ::awaitAudioNetworkOpenPermit' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -q 'Stale AUDIO CDN open suppressed before request' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -q 'rapidSkipNetworkOpenWaitsUntilFinalSelectionSettles' app/src/test/kotlin/com/nikhil/yt/playback/PlaybackStabilityGateTest.kt

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run targeted settling tests
        run: |
          gradle \
            :app:testUniversalDebugUnitTest --tests com.nikhil.yt.playback.PlaybackStabilityGateTest \
            --stacktrace \
            --no-daemon

      - name: Run full core validation
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-universal-debug-step42
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Refuse stale write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          REMOTE_HEAD="$(git rev-parse origin/cleanup/capsule-player-only)"
          if [ "$REMOTE_HEAD" != "$BASE_HEAD" ]; then
            echo "Branch moved during validation: base=$BASE_HEAD remote=$REMOTE_HEAD" >&2
            exit 1
          fi

      - name: Commit validated fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/network-open-settle-step42.yml
          rm -f tools/refactor/network_open_settle_step42.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Gate stale AUDIO requests before network open [step42-final]"
          git push origin HEAD:cleanup/capsule-player-only

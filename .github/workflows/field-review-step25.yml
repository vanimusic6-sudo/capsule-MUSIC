name: Field Review Fixes Step 25

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/field-review-step25.yml"
      - "tools/refactor/harden_field_review_step25.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: field-review-step25
  cancel-in-progress: false

jobs:
  integrate:
    name: Fix sync, prewarm and resolver regressions
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Verify field-review fix preconditions
        run: python3 tools/refactor/harden_field_review_step25.py --check

      - name: Apply field-review fixes
        run: python3 tools/refactor/harden_field_review_step25.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          MODEL="innertube/src/main/kotlin/com/nikhil/yt/innertube/models/MusicResponsiveHeaderRenderer.kt"
          PLAYER_TEST="innertube/src/test/kotlin/com/nikhil/yt/innertube/PlayerCompatibilityTest.kt"
          PREWARM="app/src/main/kotlin/com/nikhil/yt/playback/audio/SharedPrewarm.kt"
          PREWARM_TEST="app/src/test/kotlin/com/nikhil/yt/playback/audio/SharedPrewarmTest.kt"
          LOGIN="app/src/main/kotlin/com/nikhil/yt/ui/screens/LoginScreen.kt"
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          INNER="app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayer.kt"

          test "$(git diff --name-only | wc -l | tr -d ' ')" = "7"
          for file in "$MODEL" "$PLAYER_TEST" "$PREWARM" "$PREWARM_TEST" "$LOGIN" "$SERVICE" "$INNER"; do
            git diff --name-only | grep -Fxq "$file"
          done

          grep -Fq 'val buttons: List<Button> = emptyList()' "$MODEL"
          grep -Fq 'responsiveHeaderToleratesMissingButtons' "$PLAYER_TEST"
          grep -Fq 'private val timeoutMs: Long = 15_000L' "$PREWARM"
          grep -Fq 'CoroutineStart.LAZY' "$PREWARM"
          grep -Fq 'ordinaryFailureIsNotCachedAfterItCompletes' "$PREWARM_TEST"
          grep -Fq 'settings[InnerTubeCookieKey] = loginCookie' "$LOGIN"
          grep -Fq 'YouTube.authStates.first' "$LOGIN"
          ! grep -Fq '.combine(YouTube.authStates)' "$SERVICE"
          grep -Fq 'if (policy != audioStreamPolicy || quality != audioQuality)' "$SERVICE"
          grep -Fq 'Resolving audio id=%s priority=%s selectedProfile=%s' "$INNER"
          grep -Fq 'Web prewarm awaited id=%s priority=%s selectedProfile=%s' "$INNER"

          # Keep the stable playback boundaries intact.
          grep -Fq 'CapsuleAudioEngine' "$SERVICE"
          grep -Fq 'ResolvingDataSource' "$SERVICE"
          grep -Fq 'AudioResolvePriority.DOWNLOAD' app/src/main/kotlin/com/nikhil/yt/playback/DownloadUtil.kt
          grep -Fq 'CapsuleAnonymousSession.player' app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleAudioEngine.kt
          git diff --check

      - name: Run unit tests, lint and debug build
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit validated field-review fixes
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          MODEL="innertube/src/main/kotlin/com/nikhil/yt/innertube/models/MusicResponsiveHeaderRenderer.kt"
          PLAYER_TEST="innertube/src/test/kotlin/com/nikhil/yt/innertube/PlayerCompatibilityTest.kt"
          PREWARM="app/src/main/kotlin/com/nikhil/yt/playback/audio/SharedPrewarm.kt"
          PREWARM_TEST="app/src/test/kotlin/com/nikhil/yt/playback/audio/SharedPrewarmTest.kt"
          LOGIN="app/src/main/kotlin/com/nikhil/yt/ui/screens/LoginScreen.kt"
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          INNER="app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayer.kt"
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "7"
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$MODEL" "$PLAYER_TEST" "$PREWARM" "$PREWARM_TEST" "$LOGIN" "$SERVICE" "$INNER"
          git commit -m "Fix auth sync and prewarm regressions from field review"
          git push origin HEAD:cleanup/capsule-player-only

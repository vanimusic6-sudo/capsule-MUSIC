name: Capsule Playback Experiment Validation

# Keep experimental engine updates separate from the known-good release branch.
# Real networking/first-frame testing is still required after these deterministic checks.
on:
  push:
    branches:
      - 'experimental/playback-reliability-20261031'
      - 'experimental/quic-sabr-evaluation-20261031'
      - 'fix/audio-socket-resume-opus-heat-20261031'
      - 'fix/android-media-downloads-20261031'
      - 'fix/playback-download-fairness-sabr-harness-20261031'
      - 'fix/honor-native-media-transition-20261031'
      - 'fix/archivetune-media-session-parity-20261031'
      - 'fix/honor-notification-controller-20261031'
      - 'cleanup/working-honor-media-20261031'
      - 'refactor/unified-scroll-engine-20261101'
      - 'fix/playback-download-resilience-20261101'
      - 'fix/artwork-header-search-cleanup-20261101'
      - 'cleanup/extractor-boundaries-20261101'
      - 'fix/capsule-app-identity-20261101'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capsule-playback-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playback-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Install Android compile SDK and locale metadata
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "$SDKMANAGER" ]]; then
            "$SDKMANAGER" 'platforms;android-37.1'
          fi
          echo 'unqualifiedResLocale=en-US' > app/src/main/res/resources.properties
      - name: Record resolved Foundation drag engine
        run: >-
          gradle :app:dependencyInsight --dependency foundation-android
          --configuration universalDebugRuntimeClasspath --no-daemon
      - name: Inventory exact runtime dependencies and security checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          mkdir -p app/build/extractor-audit
          gradle :app:dependencies --configuration universalDebugRuntimeClasspath --no-daemon > app/build/extractor-audit/dependencies.txt
          python3 scripts/capsule_security_audit.py --dependencies app/build/extractor-audit/dependencies.txt --output app/build/extractor-audit/security
      - name: Test audio/video recovery, download lifecycle and cooldown regressions
        run: >-
          gradle :app:testUniversalDebugUnitTest
          --tests 'com.nikhil.yt.playback.*'
          --tests 'com.nikhil.yt.discovery.*'
          --tests 'com.nikhil.yt.ui.utils.*'
          --tests 'com.nikhil.yt.ui.ScrollPointerOwnershipTest'
          --tests 'com.nikhil.yt.ui.ScrollFlingCatchRegressionTest'
          --stacktrace --no-daemon --max-workers=2
      - name: Test isolated VIDEO extractor
        run: gradle :innertube:test --stacktrace --no-daemon --max-workers=2
      - name: Upload test evidence even if a later step fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-playback-experiment-tests
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/extractor-audit/
            innertube/build/test-results/
          retention-days: 14
          if-no-files-found: warn

  scroll-old-engine-repro:
    if: github.ref == 'refs/heads/refactor/unified-scroll-engine-20261101'
    # Require the new behavioral test to FAIL on the actual old drag engine.
    # A green happy-path test on both versions would not validate this repair.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Select the previous Foundation engine for this checkout only
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('gradle/libs.versions.toml')
          s = p.read_text()
          assert 'compose = "1.13.0-beta02"' in s
          p.write_text(s.replace('compose = "1.13.0-beta02"', 'compose = "1.12.1"'))
          PYCODE
          echo 'unqualifiedResLocale=en-US' > app/src/main/res/resources.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1'
      - name: Record old resolved Foundation engine
        run: >-
          gradle :app:dependencyInsight --dependency foundation-android
          --configuration universalDebugRuntimeClasspath --no-daemon
      - name: Reproduce the caught-fling regression on Foundation 1.12.1
        id: reproduce
        continue-on-error: true
        run: >-
          gradle :app:testUniversalDebugUnitTest
          --tests 'com.nikhil.yt.ui.ScrollFlingCatchRegressionTest'
          --stacktrace --no-daemon --max-workers=2
      - name: Require a behavioral failure, not a compile or infrastructure failure
        if: always()
        env:
          REPRO_OUTCOME: ${{ steps.reproduce.outcome }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path('app/build/test-results/testUniversalDebugUnitTest/TEST-com.nikhil.yt.ui.ScrollFlingCatchRegressionTest.xml')
          assert os.environ['REPRO_OUTCOME'] == 'failure', 'Old engine unexpectedly passed: investigate the reproduction'
          root = ET.parse(p).getroot()
          assert int(root.attrib['tests']) == 3
          assert int(root.attrib.get('errors', 0)) == 0
          failures = root.findall('./testcase/failure')
          assert failures, 'Need an assertion failure on the old engine'
          assert all('AssertionError' in f.attrib.get('type', '') for f in failures), 'Infrastructure failure is not a reproduction'
          print('Confirmed behavioral failure on old Foundation:', root.attrib['failures'])
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capsule-scroll-old-engine-reproduction
          path: app/build/test-results/
          retention-days: 14
          if-no-files-found: error

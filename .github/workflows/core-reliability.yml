name: Core reliability

on:
  push:
    branches: [release/01-core-reliability]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Prepare locale metadata
        run: echo 'unqualifiedResLocale=en-US' > app/src/main/res/resources.properties
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.1'
      - name: Core, download, cache and cancellation regressions
        run: >-
          gradle :app:testUniversalDebugUnitTest
          --tests 'com.nikhil.yt.playback.*'
          --tests 'com.nikhil.yt.discovery.*'
          --tests 'com.nikhil.yt.constants.AudioClientOrderTest'
          --tests 'com.nikhil.yt.ui.SeekableTransitionNaNTest'
          --tests 'com.nikhil.yt.CrashReportTest'
          --tests 'com.nikhil.yt.ui.MainTabNavigatorTest'
          --tests 'com.nikhil.yt.ui.BackRepeatGuardTest'
          --tests 'com.nikhil.yt.ui.LocalNavBackStackEntryTest'
          --tests 'com.nikhil.yt.ui.DestroyedEntryViewModelTest'
          --stacktrace --no-daemon --max-workers=2
      - name: Extractor regression tests
        run: gradle :innertube:test --stacktrace --no-daemon --max-workers=2
      - name: Android lint and runtime verification
        run: gradle :app:verifyAndroidJsonRuntime :app:lintUniversalDebug --stacktrace --no-daemon --max-workers=2
      - name: Build test APK
        run: gradle :app:assembleUniversalDebug --stacktrace --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-reliability-evidence
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-universalDebug.*
            innertube/build/test-results/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: capsule-core-reliability-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          retention-days: 14
          if-no-files-found: error

name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build signed Capsule APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' \
            | base64 --decode \
            > app/keystore/release.keystore

          test -s app/keystore/release.keystore

      - name: Verify keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore app/keystore/release.keystore \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Release keystore OK"

      - name: Prepare locale metadata
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Resolve release version
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1 | xargs)"
          test -n "$VERSION_NAME"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Build Universal Release APK
        run: |
          gradle :app:assembleUniversalRelease \
            --stacktrace \
            --no-daemon

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/universal/release \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          test -n "$APK"
          test -s "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

          echo "APK:"
          echo "$APK"

          echo "SHA-256:"
          sha256sum "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "${{ steps.apk.outputs.path }}"

      - name: Prepare Capsule release asset
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.apk.outputs.path }}" Capsule.apk
          test -s Capsule.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-Universal-Release
          path: Capsule.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" Capsule.apk \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" Capsule.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "Capsule $VERSION" \
              --generate-notes
          fi

      - name: Remove keystore
        if: always()
        shell: bash
        run: |
          rm -f app/keystore/release.keystore

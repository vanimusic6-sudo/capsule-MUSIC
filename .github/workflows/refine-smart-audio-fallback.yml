name: Refine smart audio fallback

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - .github/workflows/refine-smart-audio-fallback.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Refine family-aware quarantine
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_block(text, start_marker, end_marker, replacement):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          policy = Path('app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleAudioFallbackPolicy.kt')
          text = policy.read_text(encoding='utf-8')
          budget = '    private const val MAX_FOREGROUND_ATTEMPTS = 4\n'
          if text.count(budget) != 1:
              raise SystemExit('foreground attempt budget anchor not found exactly once')
          text = text.replace(budget, '    private const val MAX_FOREGROUND_ATTEMPTS = 5\n', 1)
          anchor = '    /** After a bot-check use at most one fallback and prefer another client family. */\n'
          if text.count(anchor) != 1:
              raise SystemExit('bot quarantine insertion anchor not found exactly once')
          addition = '\n'.join([
              '    /**',
              '     * A bot challenge belongs to a client identity family, not just one version/profile.',
              '     * Do not immediately retry a sibling identity that is likely to share the same signal.',
              '     */',
              '    fun botQuarantineProfiles(profileId: String): Set<String> {',
              '        val normalized = normalize(profileId)',
              '        if (normalized.isBlank()) return emptySet()',
              '        return when (familyOf(normalized)) {',
              '            "VISION" -> setOf(VISIONOS, VISIONOS_0_1)',
              '            "WEB_MUSIC" -> setOf(WEB_REMIX, WEB_CREATOR)',
              '            "WEB_EMBEDDED" -> setOf(WEB_EMBEDDED)',
              '            "TV" -> setOf(TVHTML5_SIMPLY)',
              '            else -> setOf(normalized)',
              '        }',
              '    }',
              '',
          ])
          text = text.replace(anchor, addition + anchor, 1)
          policy.write_text(text, encoding='utf-8')

          safety = Path('app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsulePlaybackSafety.kt')
          text = safety.read_text(encoding='utf-8')
          replacement = '\n'.join([
              '    fun markProfileBotCheck(',
              '        profileId: String,',
              '        nowMs: Long = System.currentTimeMillis(),',
              '    ) {',
              '        val normalized = normalizeProfileId(profileId)',
              '        val profiles = CapsuleAudioFallbackPolicy.botQuarantineProfiles(normalized)',
              '        if (profiles.isEmpty()) return',
              '        val untilMs = nowMs + PROFILE_BOT_QUARANTINE_MS',
              '        profiles.forEach { profile ->',
              '            botProfileQuarantineUntilMs[profile] = untilMs',
              '        }',
              '        Timber.tag(TAG).w(',
              '            "AUDIO client family quarantined after bot-check triggerProfile=%s profiles=%s durationMs=%d",',
              '            normalized,',
              '            profiles.joinToString(","),',
              '            PROFILE_BOT_QUARANTINE_MS,',
              '        )',
              '    }',
              '',
          ])
          text = replace_block(
              text,
              '    fun markProfileBotCheck(',
              '    fun quarantinedProfileIds(',
              replacement,
          )
          safety.write_text(text, encoding='utf-8')

          fallback_test = Path('app/src/test/kotlin/com/nikhil/yt/playback/audio/CapsuleAudioFallbackPolicyTest.kt')
          text = fallback_test.read_text(encoding='utf-8')
          marker = '    @Test\n    fun backgroundResolveNeverRotatesProfiles() {'
          if text.count(marker) != 1:
              raise SystemExit('fallback test insertion anchor not found exactly once')
          tests = '\n'.join([
              '    @Test',
              '    fun authenticatedPlaybackKeepsTvAsRareLastFallback() {',
              '        val plan =',
              '            CapsuleAudioFallbackPolicy.profilePlan(',
              '                primaryProfileId = CapsuleAudioFallbackPolicy.WEB_REMIX,',
              '                priority = AudioResolvePriority.PLAYBACK,',
              '                authenticated = true,',
              '                isUploaded = false,',
              '                excludedProfiles = emptySet(),',
              '            )',
              '',
              '        assertEquals(',
              '            listOf(',
              '                "WEB_REMIX",',
              '                "VISIONOS_0_1",',
              '                "WEB_EMBEDDED_PLAYER",',
              '                "WEB_CREATOR",',
              '                "TVHTML5_SIMPLY",',
              '            ),',
              '            plan,',
              '        )',
              '    }',
              '',
              '    @Test',
              '    fun botQuarantineCoversSiblingIdentityProfiles() {',
              '        assertEquals(',
              '            setOf("WEB_REMIX", "WEB_CREATOR"),',
              '            CapsuleAudioFallbackPolicy.botQuarantineProfiles("WEB_REMIX"),',
              '        )',
              '        assertEquals(',
              '            setOf("VISIONOS", "VISIONOS_0_1"),',
              '            CapsuleAudioFallbackPolicy.botQuarantineProfiles("VISIONOS_0_1"),',
              '        )',
              '        assertEquals(',
              '            setOf("TVHTML5_SIMPLY"),',
              '            CapsuleAudioFallbackPolicy.botQuarantineProfiles("TVHTML5_SIMPLY"),',
              '        )',
              '    }',
              '',
          ])
          fallback_test.write_text(text.replace(marker, tests + marker, 1), encoding='utf-8')

          safety_test = Path('app/src/test/kotlin/com/nikhil/yt/playback/audio/CapsulePlaybackSafetyTest.kt')
          text = safety_test.read_text(encoding='utf-8')
          replacement = '\n'.join([
              '    @Test',
              '    fun profileBotCheckQuarantinesWholeIdentityFamilyOnly() {',
              '        CapsulePlaybackSafety.markProfileBotCheck("web_remix")',
              '',
              '        assertEquals(',
              '            setOf("WEB_REMIX", "WEB_CREATOR"),',
              '            CapsulePlaybackSafety.quarantinedProfileIds(),',
              '        )',
              '        assertNull(CapsulePlaybackSafety.blockedExceptionOrNull())',
              '    }',
              '',
              '    @Test',
              '    fun visionBotCheckQuarantinesBothVisionProfilesWithoutGlobalBreaker() {',
              '        CapsulePlaybackSafety.markProfileBotCheck("visionos_0_1")',
              '',
              '        assertEquals(',
              '            setOf("VISIONOS", "VISIONOS_0_1"),',
              '            CapsulePlaybackSafety.quarantinedProfileIds(),',
              '        )',
              '        assertNull(CapsulePlaybackSafety.blockedExceptionOrNull())',
              '    }',
              '',
          ])
          text = replace_block(
              text,
              '    @Test\n    fun profileBotCheckQuarantinesOnlyProfile() {',
              '    @Test\n    fun ageRestrictionDoesNotLookLikeBotCheck() {',
              replacement,
          )
          safety_test.write_text(text, encoding='utf-8')
          PY

          git diff --check

      - name: Run targeted unit tests
        run: >-
          ./gradlew :app:testUniversalDebugUnitTest
          --tests "com.nikhil.yt.playback.audio.CapsuleAudioFallbackPolicyTest"
          --tests "com.nikhil.yt.playback.audio.CapsulePlaybackSafetyTest"
          --tests "com.nikhil.yt.playback.audio.CapsuleAudioClientStrategyTest"

      - name: Compile production variants
        run: ./gradlew :app:compileUniversalDebugKotlin :app:compileArmeabiDebugKotlin

      - name: Commit production refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'capsule-ci'
          git config user.email 'capsule-ci@users.noreply.github.com'
          git add \
            app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleAudioFallbackPolicy.kt \
            app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsulePlaybackSafety.kt \
            app/src/test/kotlin/com/nikhil/yt/playback/audio/CapsuleAudioFallbackPolicyTest.kt \
            app/src/test/kotlin/com/nikhil/yt/playback/audio/CapsulePlaybackSafetyTest.kt
          git diff --cached --quiet && { echo 'No production refinement to commit'; exit 1; }
          git commit -m 'Refine audio bot-check family quarantine'
          git push origin HEAD:cleanup/capsule-player-only

      - name: Remove temporary smart-fallback tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/refine-smart-audio-fallback.yml \
            .github/workflows/apply-smart-audio-fallback.yml \
            .github/scripts/apply_smart_audio_fallback.py
          git commit -m 'Remove temporary smart fallback workflows'
          git push origin HEAD:cleanup/capsule-player-only

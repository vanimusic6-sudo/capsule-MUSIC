name: WEB_REMIX Recovery Step 27

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/web-remix-recovery-step27.yml"
      - "tools/refactor/fix_web_remix_step27.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-remix-recovery-step27
  cancel-in-progress: false

jobs:
  harden:
    name: Align WEB_REMIX recovery with Metrolist
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Verify WEB_REMIX fix preconditions
        run: python3 tools/refactor/fix_web_remix_step27.py --check

      - name: Apply WEB_REMIX recovery fixes
        run: python3 tools/refactor/fix_web_remix_step27.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          PLAYER="app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayer.kt"
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          TEST="app/src/test/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayerTest.kt"

          # Make the newly created regression test visible to git diff without staging its contents.
          git add -N "$TEST"
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "3"
          for file in "$PLAYER" "$SERVICE" "$TEST"; do
            git diff --name-only | grep -Fxq "$file"
          done

          grep -Fq 'withEmbeddedConfigFallback()' "$PLAYER"
          grep -Fq 'fetchEmbeddedConfig(' "$PLAYER"
          grep -Fq 'useLoginCookies = false' "$PLAYER"
          grep -Fq 'failedWatchPageFallsBackToAnonymousEmbeddedConfig' "$TEST"
          ! grep -Fq 'cipherSessionFailure' "$PLAYER"
          ! grep -Fq 'checkCipherSession(' "$PLAYER"
          ! grep -Fq 'Cipher session breaker opened' "$PLAYER"
          ! grep -Fq 'Web prewarm awaited' "$PLAYER"
          ! grep -Fq 'deterministic QuickJS session breaker' "$SERVICE"

          # Keep the existing one-extraction-at-a-time safety and explicit client policy.
          grep -Fq 'private val resolveMutex = Mutex()' "$PLAYER"
          grep -Fq 'playbackClientOverrideId = playbackClientOverrideId' "$PLAYER"
          grep -Fq 'fallbackStrategy = CapsuleAudioClientStrategy' "$PLAYER"
          grep -Fq 'CapsulePlaybackSafety.blockedExceptionOrNull()' "$PLAYER"
          git diff --check

      - name: Run audio tests, app tests, lint and debug build
        run: |
          gradle \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit validated WEB_REMIX recovery fixes
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          FILES=(
            app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayer.kt
            app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
            app/src/test/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayerTest.kt
          )
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "${#FILES[@]}"
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "Fix WEB_REMIX cipher recovery and startup path"
          git push origin HEAD:cleanup/capsule-player-only

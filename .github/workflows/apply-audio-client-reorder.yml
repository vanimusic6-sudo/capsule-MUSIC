name: Apply audio client reorder fix

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - .github/workflows/apply-audio-client-reorder.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Persist every client reorder immediately
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt')
          text = path.read_text(encoding='utf-8')
          old = '''    if (showAudioClientPriorityDialog) {
              AudioClientPriorityDialog(
                  currentOrder = audioClientOrder,
                  resetOrder = AudioClientOrder.legacyOrder(audioStreamPolicy),
                  onDismiss = { showAudioClientPriorityDialog = false },
                  onSave = { newOrder ->
                      onAudioClientOrderChange(AudioClientOrder.encode(newOrder))
                      showAudioClientPriorityDialog = false
                  },
              )
          }
          '''
          # Source indentation is conventional 4/8 spaces; keep a second exact form so
          # this workflow fails rather than silently patching an unexpected block.
          old = old.replace('              AudioClientPriorityDialog', '        AudioClientPriorityDialog') \
                   .replace('                  currentOrder', '            currentOrder') \
                   .replace('                  resetOrder', '            resetOrder') \
                   .replace('                  onDismiss', '            onDismiss') \
                   .replace('                  onSave', '            onSave') \
                   .replace('                      onAudio', '                onAudio') \
                   .replace('                      showAudio', '                showAudio') \
                   .replace('                  },', '            },') \
                   .replace('              )', '        )') \
                   .replace('          }', '    }')
          new = '''    if (showAudioClientPriorityDialog) {
              AudioClientPriorityDialog(
                  currentOrder = audioClientOrder,
                  resetOrder = AudioClientOrder.legacyOrder(audioStreamPolicy),
                  onDismiss = { showAudioClientPriorityDialog = false },
                  onOrderChange = { newOrder ->
                      onAudioClientOrderChange(AudioClientOrder.encode(newOrder))
                  },
              )
          }
          '''
          new = new.replace('              AudioClientPriorityDialog', '        AudioClientPriorityDialog') \
                   .replace('                  currentOrder', '            currentOrder') \
                   .replace('                  resetOrder', '            resetOrder') \
                   .replace('                  onDismiss', '            onDismiss') \
                   .replace('                  onOrderChange', '            onOrderChange') \
                   .replace('                      onAudio', '                onAudio') \
                   .replace('                  },', '            },') \
                   .replace('              )', '        )') \
                   .replace('          }', '    }')
          if text.count(old) != 1:
              raise SystemExit('unexpected AudioClientPriorityDialog call site; refusing to patch')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify source diff
        run: |
          grep -q 'onOrderChange = { newOrder ->' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt
          ! grep -q 'onSave = { newOrder ->' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt
          grep -q 'rememberReorderableLazyListState' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/AudioClientPriorityDialog.kt
          grep -q 'Modifier.draggableHandle()' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/AudioClientPriorityDialog.kt
          git diff --check

      - name: Compile debug variants
        run: ./gradlew :app:compileUniversalDebugKotlin :app:compileArmeabiDebugKotlin --stacktrace

      - name: Commit persistent order wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt
          git diff --cached --check
          git commit -m "Persist audio client order while dragging"
          git push origin HEAD:cleanup/capsule-player-only

name: Playback Hardening Step 22

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/playback-hardening-step22.yml"
      - "tools/refactor/harden_together_shutdown.py"
      - "app/src/main/kotlin/com/nikhil/yt/playback/TogetherShutdownGate.kt"
      - "app/src/test/kotlin/com/nikhil/yt/playback/TogetherShutdownGateTest.kt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playback-hardening-step22
  cancel-in-progress: false

jobs:
  integrate:
    name: Harden Together service teardown
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Verify Together teardown preconditions
        run: python3 tools/refactor/harden_together_shutdown.py --check

      - name: Move Together teardown to process lifetime
        run: python3 tools/refactor/harden_together_shutdown.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          APP="app/src/main/kotlin/com/nikhil/yt/App.kt"
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$APP" "$SERVICE" | sort)"
          test "$changed" = "$expected"
          grep -Fq 'internal fun launchLifecycleCleanup(block: suspend () -> Unit)' "$APP"
          grep -Fq 'applicationScope.launch(Dispatchers.IO) { block() }' "$APP"
          grep -Fq 'private val togetherShutdownGate = TogetherShutdownGate()' "$SERVICE"
          grep -Fq 'App.instance.launchLifecycleCleanup' "$SERVICE"
          grep -Fq 'if (!togetherShutdownGate.tryBegin()) return' "$SERVICE"
          ! grep -Fq 'scope.launch { stopTogetherInternal() }' "$SERVICE"
          ! grep -Fq 'runCatching { scope.launch { stopTogetherInternal() } }' "$SERVICE"
          grep -Fq 'CapsuleAudioEngine' "$SERVICE"
          grep -Fq 'ResolvingDataSource' "$SERVICE"
          git diff --check

      - name: Run unit tests, lint and debug build
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit validated Together teardown hardening
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          APP="app/src/main/kotlin/com/nikhil/yt/App.kt"
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$APP" "$SERVICE" | sort)"
          test "$changed" = "$expected"
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$APP" "$SERVICE"
          git commit -m "Make Together teardown survive service cancellation"
          git push origin HEAD:cleanup/capsule-player-only

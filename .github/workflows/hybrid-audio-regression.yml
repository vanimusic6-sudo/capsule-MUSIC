name: Capsule Hybrid Audio Regression

on:
  push:
    branches:
      - feature/audio-hybrid-innertubex-sabr-20261120
    paths:
      - 'app/src/main/kotlin/com/nikhil/yt/playback/**'
      - 'app/src/test/kotlin/com/nikhil/yt/playback/**'
      - '.github/workflows/hybrid-audio-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capsule-hybrid-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hybrid-regression:
    name: Verify SABR, CDN recovery and long-form audio
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android SDK and locale
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "$SDKMANAGER" ]]; then
            "$SDKMANAGER" 'platforms;android-37.1'
          fi
          echo 'unqualifiedResLocale=en-US' > app/src/main/res/resources.properties
      - name: Test hybrid protocol and bounded rollback
        run: >-
          gradle :app:testUniversalDebugUnitTest
          --tests 'com.nikhil.yt.playback.AudioCdnRecoveryPlanTest'
          --tests 'com.nikhil.yt.playback.AudioBufferStallPolicyTest'
          --tests 'com.nikhil.yt.playback.PlaybackRecoveryCoordinatorTest'
          --tests 'com.nikhil.yt.playback.audio.CapsuleSabrAudioDataSourceTest'
          --tests 'com.nikhil.yt.playback.audio.CapsuleSabrRoutePolicyTest'
          --tests 'com.nikhil.yt.playback.audio.AudioChunkedDataSourceTest'
          --tests 'com.nikhil.yt.playback.audio.AudioCdnRecoveryTest'
          --tests 'com.nikhil.yt.playback.DownloadUtilSingletonTest'
          --stacktrace --no-daemon --max-workers=2
      - name: Save regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-hybrid-audio-tests
          path: |
            app/build/test-results/testUniversalDebugUnitTest/
            app/build/reports/tests/testUniversalDebugUnitTest/
          retention-days: 7
          if-no-files-found: warn

name: Release APK

# Official developer-signed APKs are NEVER built on every code push.
# Run manually from Actions, select the vetted main or release/* branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capsule-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build signed Universal APK
    # Treat the signed certificate as a production identity, never a CI test
    # artifact from an arbitrary feature/fix/audit branch.
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
    # OWNER ACTION: protect this environment with required reviewer and
    # allowed protected branches. An unprotected environment gives NO extra safety.
    environment: capsule-signing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Install compile SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "$SDKMANAGER" ]]; then
            "$SDKMANAGER" 'platforms;android-37.1'
          else
            echo 'SDK CLI unavailable; Android Gradle Plugin will install compile SDK 37.1.'
          fi

      - name: Validate official signing credentials
        shell: bash
        env:
          CAPSULE_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for value in "$CAPSULE_KEYSTORE" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "::error::Official signing secrets are missing. Configure capsule-signing Environment secrets."
              exit 1
            fi
          done
      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' \
            | base64 --decode \
            > app/keystore/release.keystore

          test -s app/keystore/release.keystore

      - name: Verify keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore app/keystore/release.keystore \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Release keystore OK"

      - name: Prepare locale metadata
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Build Universal Release APK
        run: |
          gradle :app:verifyAndroidJsonRuntime :app:assembleUniversalRelease \
            --stacktrace \
            --no-daemon

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/universal/release \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          test -n "$APK"
          test -s "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

          echo "APK:"
          echo "$APK"

          echo "SHA-256:"
          sha256sum "$APK"

      - name: Verify platform JSON in optimized release
        shell: bash
        run: |
          set -euo pipefail
          MAPPING=app/build/outputs/mapping/universalRelease/mapping.txt
          test -s "$MAPPING"
          if rg -n '^org\.json\.[^ ]+ -> ' "$MAPPING"; then
            echo 'Desktop JSON classes entered the optimized Android APK'
            exit 1
          fi
          echo 'Optimized release uses platform JSON classes'

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "${{ steps.apk.outputs.path }}"

      - name: Verify current APK signer provenance and permission privacy policy
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          python3 scripts/verify_release_security.py \
            "${{ steps.apk.outputs.path }}" \
            --apksigner "$APKSIGNER" \
            --aapt "$AAPT" \
            --output security-results/current-release-check.json

      - name: Upload current-release security evidence
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-MUSIC-Release-Security
          path: security-results/current-release-check.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-MUSIC-Universal-Release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload release mapping
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-MUSIC-Release-Mapping
          path: app/build/outputs/mapping/universalRelease/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        shell: bash
        run: |
          rm -f app/keystore/release.keystore

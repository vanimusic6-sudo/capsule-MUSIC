name: Service Refactor Step 11

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/service-refactor-step11.yml"
      - "tools/refactor/fix_automix_persistence_seed.py"
      - "app/src/main/kotlin/com/nikhil/yt/models/PersistQueue.kt"
      - "app/src/main/kotlin/com/nikhil/yt/playback/AutomixRuntime.kt"
      - "app/src/test/kotlin/com/nikhil/yt/playback/AutomixRuntimeTest.kt"
      - "app/src/test/kotlin/com/nikhil/yt/playback/PersistQueueSerializationTest.kt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-refactor-step11
  cancel-in-progress: false

jobs:
  integrate:
    name: Make Automix restore deterministic
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Verify Automix persistence-fix preconditions
        run: python3 tools/refactor/fix_automix_persistence_seed.py --check

      - name: Remove timing-dependent Automix restore
        run: python3 tools/refactor/fix_automix_persistence_seed.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only)"
          test "$changed" = "$SERVICE"
          ! grep -Fq 'automixRuntime.seedMediaId = player.currentMetadata?.id' "$SERVICE"
          grep -Fq 'var restoredQueueSeedMediaId: String? = null' "$SERVICE"
          grep -Fq '.getOrNull(persistedQueue.mediaItemIndex)' "$SERVICE"
          grep -Fq 'automixRuntime.restore(' "$SERVICE"
          grep -Fq 'persistedSeedMediaId = persistedAutomix.automixSeedMediaId' "$SERVICE"
          grep -Fq 'fallbackSeedMediaId = restoredQueueSeedMediaId' "$SERVICE"
          grep -Fq 'restoredAutoAddedMediaIds = persistedAutomix.automixAutoAddedMediaIds' "$SERVICE"
          grep -Fq 'automixAutoAddedMediaIds = automixAutoAddedSnapshot' "$SERVICE"
          git diff --check

      - name: Run unit tests, lint and debug build
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit validated Automix persistence fix
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only)"
          test "$changed" = "$SERVICE"
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$SERVICE"
          git commit -m "Persist Automix ownership without player timing"
          git push origin HEAD:cleanup/capsule-player-only

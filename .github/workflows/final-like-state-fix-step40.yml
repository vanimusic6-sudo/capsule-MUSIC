name: Final Like State Fix Step 40

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - "tools/refactor/final_like_state_fix_step40.py"
      - ".github/workflows/final-like-state-fix-step40.yml"

permissions:
  contents: write

concurrency:
  group: final-like-state-fix-step40
  cancel-in-progress: false

jobs:
  harden:
    name: Fix like state, test, lint and commit
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Capture base head
        id: base
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Apply final like-state fix
        run: python3 tools/refactor/final_like_state_fix_step40.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'private val songMutationMutex = Mutex()' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -F 'Toggle like applied id=%s liked=%s source=%s' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -F 'ensureSongForMutation' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          if grep -F 'val song = it.song.toggleLike()' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt; then
            echo 'Old duplicate remote-like path still exists' >&2
            exit 1
          fi

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run full core validation
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-like-fix-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Refuse stale write
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          REMOTE_SHA="$(git rev-parse origin/cleanup/capsule-player-only)"
          if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
            echo "Branch moved during validation: base=$BASE_SHA remote=$REMOTE_SHA" >&2
            exit 1
          fi

      - name: Commit validated fix and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/refactor/final_like_state_fix_step40.py
          rm -f .github/workflows/final-like-state-fix-step40.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix player like state synchronization [step40-final]"
          git push origin HEAD:cleanup/capsule-player-only

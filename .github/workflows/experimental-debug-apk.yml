name: Experimental Debug APK (fast)

on:
  push:
    branches:
      - experimental/discovery-open-catalogs-20261022
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capsule-experimental-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build experimental universal debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          echo 'unqualifiedResLocale=en-US' > app/src/main/res/resources.properties

      - name: Assemble universal debug APK
        run: |
          gradle :app:verifyAndroidJsonRuntime :app:assembleUniversalDebug \
            --no-daemon --stacktrace

      - name: Locate APK and checksum
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/universal/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          sha256sum "$APK"

      - name: Upload experimental debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-MUSIC-Experimental-Universal-Debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

name: Fix audio client context

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - .github/workflows/fix-audio-client-context.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fix playback context client order binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt')
          text = path.read_text()
          pattern = re.compile(r'    private fun playbackContext\(\) = AudioPlaybackContext\(\s*audioQuality\.normalizedPlaybackQuality\(\),\s*audioStreamPolicy,\s*connectivityManager\.isActiveNetworkMetered,\s*audioClientOrder,\s*\)')
          replacement = "    private fun playbackContext() = AudioPlaybackContext(\n        quality = audioQuality.normalizedPlaybackQuality(),\n        policy = audioStreamPolicy,\n        metered = connectivityManager.isActiveNetworkMetered,\n        clientOrder = audioClientOrder,\n    )"
          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'Expected exactly one positional AudioPlaybackContext block, found {count}')
          path.write_text(updated)
          PY
          git diff --check
          grep -q 'quality = audioQuality.normalizedPlaybackQuality()' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -q 'clientOrder = audioClientOrder' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt

      - name: Verify priority tests
        run: >-
          ./gradlew :app:testUniversalDebugUnitTest
          --tests "com.nikhil.yt.constants.AudioClientOrderTest"
          --tests "com.nikhil.yt.playback.audio.CapsuleAudioFallbackPolicyTest"
          --tests "com.nikhil.yt.playback.audio.CapsulePlaybackSafetyTest"
          --tests "com.nikhil.yt.playback.audio.CapsuleAudioClientStrategyTest"

      - name: Compile production variants
        run: ./gradlew :app:compileUniversalDebugKotlin :app:compileArmeabiDebugKotlin

      - name: Commit context fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'capsule-ci'
          git config user.email 'capsule-ci@users.noreply.github.com'
          git add app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          git diff --cached --quiet && { echo 'No production changes to commit'; exit 1; }
          git commit -m 'Fix audio client priority playback context'
          git push origin HEAD:cleanup/capsule-player-only

      - name: Remove temporary context workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-audio-client-context.yml
          git commit -m 'Remove temporary audio client context workflow'
          git push origin HEAD:cleanup/capsule-player-only

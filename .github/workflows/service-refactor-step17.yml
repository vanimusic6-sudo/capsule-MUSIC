name: Service Refactor Step 17

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/service-refactor-step17.yml"
      - "tools/refactor/extract_playback_recovery_coordinator.py"
      - "app/src/main/kotlin/com/nikhil/yt/playback/PlaybackRecoveryCoordinator.kt"
      - "app/src/test/kotlin/com/nikhil/yt/playback/PlaybackRecoveryCoordinatorTest.kt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-refactor-step17
  cancel-in-progress: false

jobs:
  integrate:
    name: Extract playback recovery coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Verify recovery extraction preconditions
        run: python3 tools/refactor/extract_playback_recovery_coordinator.py --check

      - name: Move recovery state out of MusicService
        run: python3 tools/refactor/extract_playback_recovery_coordinator.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only)"
          test "$changed" = "$SERVICE"
          grep -Fq 'private val playbackRecoveryCoordinator by lazy' "$SERVICE"
          grep -Fq 'playbackRecoveryCoordinator.onConnectivityChanged(isConnected)' "$SERVICE"
          grep -Fq 'playbackRecoveryCoordinator.recoverFromNetworkError()' "$SERVICE"
          grep -Fq 'playbackRecoveryCoordinator.nextRetryDelayMs(' "$SERVICE"
          grep -Fq 'playbackRecoveryCoordinator.recordTerminalFailure(' "$SERVICE"
          grep -Fq 'TerminalPlaybackAction.SKIP -> skipOnError()' "$SERVICE"
          grep -Fq 'override fun onPlayerError(error: PlaybackException)' "$SERVICE"
          grep -Fq 'private fun scheduleStreamRefreshRetry(' "$SERVICE"
          ! grep -Fq 'private var networkRecoveryJob: Job? = null' "$SERVICE"
          ! grep -Fq 'private val playbackRetryBudget = PlaybackRetryBudget()' "$SERVICE"
          ! grep -Fq 'private val trackFailureGuard =' "$SERVICE"
          ! grep -Fq 'private var trackFailureResetJob: Job? = null' "$SERVICE"
          ! grep -Fq 'private fun waitOnNetworkError()' "$SERVICE"
          ! grep -Fq 'private fun scheduleTrackFailureGuardReset(mediaId: String)' "$SERVICE"
          git diff --check

      - name: Run unit tests, lint and debug build
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit validated recovery extraction
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only)"
          test "$changed" = "$SERVICE"
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$SERVICE"
          git commit -m "Move playback recovery state out of MusicService"
          git push origin HEAD:cleanup/capsule-player-only

name: Service Refactor Step 1

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/service-refactor-step1.yml"
      - "tools/refactor/apply_audio_resolve_coordinator.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-refactor-step1
  cancel-in-progress: false

jobs:
  integrate:
    name: Integrate and validate audio resolve coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Verify guarded transform
        run: python3 tools/refactor/apply_audio_resolve_coordinator.py --check

      - name: Integrate coordinator into MusicService
        run: python3 tools/refactor/apply_audio_resolve_coordinator.py

      - name: Verify only MusicService changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          git diff --check

      - name: Run unit tests, lint and debug build
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Commit validated integration
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          changed="$(git diff --name-only)"
          test "$changed" = "app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          git commit -m "Move audio resolve lifecycle out of MusicService"
          git push origin HEAD:cleanup/capsule-player-only

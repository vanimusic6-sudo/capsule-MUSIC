name: Capsule Optimized DEV Release

# Optimized developer builds are separate from the official release signer.
# A push is enough to start a build; no GitHub Actions write scope is needed.
on:
  push:
    branches:
      - 'audit/**'
      - 'dev/**'
      - 'fix/**'
      - 'feature/**'
      - 'polish/**'
      - 'next/**'
      - 'perf/**'
      - 'refactor/**'
      - 'experimental/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capsule-dev-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-release:
    name: Build R8-optimized and signed DEV APK
    runs-on: ubuntu-latest
    timeout-minutes: 75

    # Deliberately do not reference STORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD,
    # KEYSTORE_BASE64 or the official capsule-signing environment.
    env:
      CAPSULE_DEV_KEYSTORE_BASE64: ${{ secrets.CAPSULE_DEV_KEYSTORE_BASE64 }}
      DEV_STORE_PASSWORD: ${{ secrets.CAPSULE_DEV_STORE_PASSWORD }}
      DEV_KEY_ALIAS: ${{ secrets.CAPSULE_DEV_KEY_ALIAS }}
      DEV_KEY_PASSWORD: ${{ secrets.CAPSULE_DEV_KEY_PASSWORD }}

    steps:
      - name: Checkout active development branch
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Prepare Android compile SDK and resource locale
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "$SDKMANAGER" ]]; then
            "$SDKMANAGER" 'platforms;android-37.1'
          fi
          echo 'unqualifiedResLocale=en-US' > app/src/main/res/resources.properties

      - name: Prepare an isolated development-only signing key
        id: dev-signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          test ! -e app/keystore/release.keystore
          KEYSTORE=app/keystore/development-release.keystore
          if [[ -n "$CAPSULE_DEV_KEYSTORE_BASE64" ]]; then
            for value in "$DEV_STORE_PASSWORD" "$DEV_KEY_ALIAS" "$DEV_KEY_PASSWORD"; do
              if [[ -z "$value" ]]; then
                echo "::error::All four CAPSULE_DEV_* secrets are required for persistent signing."
                exit 1
              fi
            done
            printf '%s' "$CAPSULE_DEV_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            echo 'mode=persistent' >> "$GITHUB_OUTPUT"
            echo 'Using separately provisioned development signing identity' >> "$GITHUB_STEP_SUMMARY"
          else
            if [[ -n "$DEV_STORE_PASSWORD" || -n "$DEV_KEY_ALIAS" || -n "$DEV_KEY_PASSWORD" ]]; then
              echo "::error::Partial CAPSULE_DEV_* secrets: set all four or none."
              exit 1
            fi
            DEV_STORE_PASSWORD="$(openssl rand -hex 24)"
            DEV_KEY_PASSWORD="$DEV_STORE_PASSWORD"
            DEV_KEY_ALIAS="capsule-dev"
            echo "::add-mask::$DEV_STORE_PASSWORD"
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore "$KEYSTORE" \
              -storepass "$DEV_STORE_PASSWORD" \
              -keypass "$DEV_KEY_PASSWORD" \
              -alias "$DEV_KEY_ALIAS" \
              -keyalg RSA -keysize 3072 -validity 3650 \
              -dname "CN=Capsule DEV, O=Nonproduction, C=US"
            echo "DEV_STORE_PASSWORD=$DEV_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DEV_KEY_PASSWORD=$DEV_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "DEV_KEY_ALIAS=$DEV_KEY_ALIAS" >> "$GITHUB_ENV"
            echo 'mode=ephemeral' >> "$GITHUB_OUTPUT"
            echo 'Ephemeral DEV signer: uninstall the previous DEV build before installing this one.' >> "$GITHUB_STEP_SUMMARY"
          fi
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" \
            -storepass "$DEV_STORE_PASSWORD" -alias "$DEV_KEY_ALIAS" >/dev/null
          chmod 600 "$KEYSTORE"

      - name: Assemble actual optimized (R8 + shrinking) DEV Release
        shell: bash
        run: |
          gradle :app:verifyAndroidJsonRuntime :app:assembleUniversalDevRelease \
            --stacktrace --no-daemon --max-workers=2

      - name: Verify optimized APK package, signing and R8 output
        shell: bash
        id: apk
        run: |
          set -euo pipefail
          test -s app/build/outputs/mapping/universalDevRelease/mapping.txt
          APK="$(find app/build/outputs/apk/universal/devRelease \
            -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep -Fq "package: name='com.nikhil.yt.dev'"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "signing_mode=${{ steps.dev-signing.outputs.mode }}" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $(sha256sum "$APK" | cut -d ' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "Package: com.nikhil.yt.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full optimized DEV Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-DEV-Release-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping privately for debugging
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-DEV-R8-Mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/universalDevRelease/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Erase transient development keystore
        if: always()
        shell: bash
        run: rm -f app/keystore/development-release.keystore

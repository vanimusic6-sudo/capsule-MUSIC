<!DOCTYPE html>
<html lang="en"><head><title></title><script>
var bgVmFunctions = null;
var bgVm = null;
var bgProgram = null;
var poTokenMinter = null;

function loadBotGuard(challengeData) {
  bgVm = window[challengeData.globalName];
  bgProgram = challengeData.program;
  bgVmFunctions = null;
  if (!bgVm || !bgVm.a) throw new Error('BotGuard VM unavailable');

  var callback = function(asyncSnapshotFunction, shutdownFunction, passEventFunction, checkCameraFunction) {
    bgVmFunctions = {
      asyncSnapshotFunction: asyncSnapshotFunction,
      shutdownFunction: shutdownFunction,
      passEventFunction: passEventFunction,
      checkCameraFunction: checkCameraFunction
    };
  };

  bgVm.a(bgProgram, callback, true, undefined, function(){}, [[], []]);
  return new Promise(function(resolve, reject) {
    var attempts = 0;
    var timer = setInterval(function() {
      if (bgVmFunctions && bgVmFunctions.asyncSnapshotFunction) {
        clearInterval(timer);
        resolve({vmFunctions:bgVmFunctions, vm:bgVm, program:bgProgram});
      } else if (++attempts >= 10000) {
        clearInterval(timer);
        reject(new Error('BotGuard snapshot initialization timed out'));
      }
    }, 1);
  });
}

function snapshot(botguard, args) {
  return new Promise(function(resolve, reject) {
    if (!botguard.vmFunctions || !botguard.vmFunctions.asyncSnapshotFunction) {
      reject(new Error('BotGuard snapshot function unavailable'));
      return;
    }
    try {
      botguard.vmFunctions.asyncSnapshotFunction(
        function(response){ resolve(response); },
        [args.contentBinding, args.signedTimestamp, args.webPoSignalOutput, args.skipPrivacyBuffer]
      );
    } catch (e) { reject(e); }
  });
}

function runBotGuard(challengeData) {
  var interpreter = challengeData.interpreterJavascript.privateDoNotAccessOrElseSafeScriptWrappedValue;
  if (!interpreter) throw new Error('BotGuard interpreter unavailable');
  new Function(interpreter)();
  var webPoSignalOutput = [];
  return loadBotGuard({globalName:challengeData.globalName, program:challengeData.program})
    .then(function(botguard){ return snapshot(botguard, {webPoSignalOutput:webPoSignalOutput}); })
    .then(function(response){ return {webPoSignalOutput:webPoSignalOutput, botguardResponse:response}; });
}

async function createPoTokenMinter(webPoSignalOutput, integrityToken) {
  var getMinter = webPoSignalOutput && webPoSignalOutput[0];
  if (typeof getMinter !== 'function') throw new Error('BotGuard minter factory unavailable');
  var result = getMinter(integrityToken);
  poTokenMinter = result && typeof result.then === 'function' ? await result : result;
  if (typeof poTokenMinter !== 'function') throw new Error('BotGuard minter unavailable');
}

async function obtainPoToken(identifier) {
  if (typeof poTokenMinter !== 'function') throw new Error('BotGuard minter not initialized');
  var result = poTokenMinter(identifier);
  result = result && typeof result.then === 'function' ? await result : result;
  if (!(result instanceof Uint8Array)) throw new Error('BotGuard returned invalid token bytes');
  return result;
}
</script></head><body></body></html>

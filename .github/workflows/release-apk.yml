name: Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build signed Universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' \
            | base64 --decode \
            > app/keystore/release.keystore

          test -s app/keystore/release.keystore

      - name: Verify keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore app/keystore/release.keystore \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Release keystore OK"

      - name: Prepare locale metadata
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Build Universal Release APK
        run: |
          gradle :app:assembleUniversalRelease \
            --stacktrace \
            --no-daemon

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/universal/release \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          test -n "$APK"
          test -s "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

          echo "APK:"
          echo "$APK"

          echo "SHA-256:"
          sha256sum "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "${{ steps.apk.outputs.path }}"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-MUSIC-Universal-Release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        shell: bash
        run: |
          rm -f app/keystore/release.keystore

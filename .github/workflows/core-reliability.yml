name: Core reliability

on:
  push:
    branches: [release/01-core-reliability, fix/posttest-ui-rework-20261026, fix/real-download-menu-repair-20261026, fix/download-actions-artist-credits-cover-20261026, fix/rebuild-download-artwork-search-20261026, fix/metrolist-search-active-download-20261026]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Prepare locale metadata
        run: echo 'unqualifiedResLocale=en-US' > app/src/main/res/resources.properties
      - name: Install compile SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "$SDKMANAGER" ]]; then
            "$SDKMANAGER" 'platforms;android-37.1'
          else
            echo 'SDK CLI unavailable; Android Gradle Plugin will install compile SDK 37.1.'
          fi
      - name: Core, download, cache and cancellation regressions
        run: >-
          gradle :app:testUniversalDebugUnitTest
          --tests 'com.nikhil.yt.playback.*'
          --tests 'com.nikhil.yt.discovery.*'
          --tests 'com.nikhil.yt.constants.AudioClientOrderTest'
          --tests 'com.nikhil.yt.ui.SeekableTransitionNaNTest'
          --tests 'com.nikhil.yt.CrashReportTest'
          --tests 'com.nikhil.yt.utils.BuildMarkerLogTest'
          --tests 'com.nikhil.yt.ui.menu.CapsuleDownloadActionInteractionTest'
          --tests 'com.nikhil.yt.ui.screens.search.SearchArtistCreditsTest'
          --tests 'com.nikhil.yt.ui.player.PlayerArtworkReliabilityTest'
          --tests 'com.nikhil.yt.models.VideoPosterCropTest'
          --tests 'com.nikhil.yt.ui.ArtistHeroTest'
          --tests 'com.nikhil.yt.ui.component.ArtworkResolutionTest'
          --tests 'com.nikhil.yt.ui.CapsuleReleaseUiCorrectionsTest'
          --tests 'com.nikhil.yt.playback.video.CapsuleVideoDirectMediaSourceFactoryTest'
          --tests 'com.nikhil.yt.ui.ArtistScreenDesignTest'
          --tests 'com.nikhil.yt.ui.ArtistMotionTest'
          --tests 'com.nikhil.yt.ui.ListStabilityTest'
          --tests 'com.nikhil.yt.ui.CapsuleMenuMotionTest'
          --tests 'com.nikhil.yt.ui.PlayerMenuGestureTest'
          --tests 'com.nikhil.yt.ui.CapsuleSubscribeMotionTest'
          --tests 'com.nikhil.yt.db.ArtistSubscriptionTest'
          --tests 'com.nikhil.yt.db.ArtistSubscriptionStateTest'
          --tests 'com.nikhil.yt.ui.MainTabNavigatorTest'
          --tests 'com.nikhil.yt.ui.BackRepeatGuardTest'
          --tests 'com.nikhil.yt.ui.LocalNavBackStackEntryTest'
          --tests 'com.nikhil.yt.ui.DestroyedEntryViewModelTest'
          --stacktrace --no-daemon --max-workers=2
      - name: Extractor regression tests
        run: gradle :innertube:test --stacktrace --no-daemon --max-workers=2
      - name: Android lint and runtime verification
        run: gradle :app:verifyAndroidJsonRuntime :app:lintUniversalDebug --stacktrace --no-daemon --max-workers=2
      - name: Build test APK
        run: gradle :app:assembleUniversalDebug --stacktrace --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-reliability-evidence
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-universalDebug.*
            innertube/build/test-results/
            app/build/reports/ui-previews/
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: capsule-core-reliability-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          retention-days: 14
          if-no-files-found: error

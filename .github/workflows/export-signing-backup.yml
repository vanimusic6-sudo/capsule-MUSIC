name: Export Signing Backup

on:
  workflow_dispatch:
  push:
    branches:
      - next/capsule-clay
    paths:
      - ".github/workflows/export-signing-backup.yml"

permissions:
  contents: read

jobs:
  export:
    name: Create encrypted signing backup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      SIGNING_BACKUP_PASSWORD: ${{ secrets.SIGNING_BACKUP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$SIGNING_BACKUP_PASSWORD"

      - name: Restore and verify release keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p signing-backup

          printf '%s' "$KEYSTORE_BASE64"             | base64 --decode             > signing-backup/release.keystore

          test -s signing-backup/release.keystore

          keytool -list             -keystore signing-backup/release.keystore             -storepass "$STORE_PASSWORD"             -alias "$KEY_ALIAS"             > /dev/null

          echo "Release keystore verified"

      - name: Save signing credentials and certificate info
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          {
            printf 'STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
            printf 'KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
          } > signing-backup/credentials.txt

          keytool -list -v             -keystore signing-backup/release.keystore             -storepass "$STORE_PASSWORD"             -alias "$KEY_ALIAS"             | grep -E 'Alias name:|SHA1:|SHA256:'             > signing-backup/certificate-fingerprints.txt || true

          sha256sum signing-backup/release.keystore             > signing-backup/release.keystore.sha256

      - name: Create encrypted archive
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

          7z a             -t7z             -mx=9             -mhe=on             -p"$SIGNING_BACKUP_PASSWORD"             Capsule-Signing-Backup.7z             ./signing-backup/*             > /dev/null

          rm -rf signing-backup

          test -s Capsule-Signing-Backup.7z
          echo "Encrypted signing backup created"

      - name: Test encrypted archive
        shell: bash
        run: |
          set -euo pipefail
          7z t             -p"$SIGNING_BACKUP_PASSWORD"             Capsule-Signing-Backup.7z             > /dev/null
          echo "Encrypted archive verified"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-Signing-Backup-ENCRYPTED
          path: Capsule-Signing-Backup.7z
          if-no-files-found: error
          retention-days: 1

      - name: Remove local backup
        if: always()
        shell: bash
        run: |
          rm -rf signing-backup
          rm -f Capsule-Signing-Backup.7z

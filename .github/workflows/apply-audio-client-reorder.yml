name: Apply audio client reorder fix

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - .github/workflows/apply-audio-client-reorder.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Persist every client reorder immediately
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?m)^(?P<indent>\s*)onSave = \{ newOrder ->\n'
              r'(?P=indent)    onAudioClientOrderChange\(AudioClientOrder\.encode\(newOrder\)\)\n'
              r'(?P=indent)    showAudioClientPriorityDialog = false\n'
              r'(?P=indent)\},$'
          )

          def replace(match):
              indent = match.group('indent')
              return (
                  indent + 'onOrderChange = { newOrder ->\n' +
                  indent + '    onAudioClientOrderChange(AudioClientOrder.encode(newOrder))\n' +
                  indent + '},'
              )

          patched, count = pattern.subn(replace, text)
          if count != 1:
              raise SystemExit(f'expected one priority save block, found {count}')
          path.write_text(patched, encoding='utf-8')
          PY

      - name: Verify source diff
        run: |
          grep -q 'onOrderChange = { newOrder ->' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt
          ! grep -q 'onSave = { newOrder ->' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt
          grep -q 'rememberReorderableLazyListState' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/AudioClientPriorityDialog.kt
          grep -q 'Modifier.draggableHandle()' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/AudioClientPriorityDialog.kt
          git diff --check

      - name: Compile debug variants
        run: ./gradlew :app:compileUniversalDebugKotlin :app:compileArmeabiDebugKotlin --stacktrace

      - name: Commit persistent order wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt
          git diff --cached --check
          git commit -m "Persist audio client order while dragging"
          git push origin HEAD:cleanup/capsule-player-only

name: CDN Recovery Stabilization Step 45

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - "tools/refactor/cdn_recovery_step45.py"
      - ".github/workflows/cdn-recovery-step45.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cdn-recovery-step45-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stabilize:
    name: Apply, validate and commit CDN recovery stabilization
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Capture base head
        shell: bash
        run: echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Apply step45
        run: python3 tools/refactor/cdn_recovery_step45.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SIGNED_URL_SESSION_REFRESH_THRESHOLD_MS = 3_000L' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -F 'shouldRetryRejectedSignedUrl' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -F 'refreshSameVisitorSession' app/src/main/kotlin/com/nikhil/yt/playback/audio/potoken/PoTokenGenerator.kt
          grep -F 'Refreshed same-visitor Web PoToken session after repeated CDN rejection' app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayer.kt
          grep -F 'signedUrlFreshResolveLoopStopsBeforeThirdRecoverySlot' app/src/test/kotlin/com/nikhil/yt/playback/CapsuleLoadErrorHandlingPolicyTest.kt

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run full core validation
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-step45-universal-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Refuse stale write
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/cleanup/capsule-player-only | cut -f1)"
          if [ "$REMOTE_HEAD" != "$BASE_HEAD" ]; then
            echo "Branch moved during validation: base=$BASE_HEAD remote=$REMOTE_HEAD"
            exit 1
          fi

      - name: Commit validated step45
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/refactor/cdn_recovery_step45.py
          rm -f .github/workflows/cdn-recovery-step45.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stabilize CDN rejection recovery [step45-final]"
          git push origin HEAD:cleanup/capsule-player-only

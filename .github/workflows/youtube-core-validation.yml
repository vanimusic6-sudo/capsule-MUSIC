name: YouTube Core Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/kotlin/com/nikhil/yt/ui/**"
      - "app/src/main/kotlin/com/nikhil/yt/MainActivity.kt"
      - "app/src/main/res/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/kotlin/com/nikhil/yt/playback/**"
      - "app/src/main/kotlin/com/nikhil/yt/extensions/**"
      - "app/src/main/kotlin/com/nikhil/yt/utils/**"
      - "app/src/main/kotlin/com/nikhil/yt/di/**"
      - "app/src/main/kotlin/com/nikhil/yt/db/**"
      - "app/build.gradle.kts"
      - "innertube/build.gradle.kts"
      - "app/src/main/kotlin/com/nikhil/yt/App.kt"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/StorageSettings.kt"
      - "app/src/test/**"
      - "app/src/main/kotlin/com/nikhil/yt/lyrics/**"
      - "betterlyrics/**"
      - "lrclib/**"
      - "innertube/src/main/**"
      - "innertube/src/test/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/youtube-core-validation.yml"
  push:
    branches:
      - main
      - cleanup/capsule-player-only
    paths:
      - "app/src/main/kotlin/com/nikhil/yt/ui/**"
      - "app/src/main/kotlin/com/nikhil/yt/MainActivity.kt"
      - "app/src/main/res/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/kotlin/com/nikhil/yt/playback/**"
      - "app/src/main/kotlin/com/nikhil/yt/extensions/**"
      - "app/src/main/kotlin/com/nikhil/yt/utils/**"
      - "app/src/main/kotlin/com/nikhil/yt/di/**"
      - "app/src/main/kotlin/com/nikhil/yt/db/**"
      - "app/build.gradle.kts"
      - "innertube/build.gradle.kts"
      - "app/src/main/kotlin/com/nikhil/yt/App.kt"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/StorageSettings.kt"
      - "app/src/test/**"
      - "app/src/main/kotlin/com/nikhil/yt/lyrics/**"
      - "betterlyrics/**"
      - "lrclib/**"
      - "innertube/src/main/**"
      - "innertube/src/test/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/youtube-core-validation.yml"

permissions:
  contents: read

concurrency:
  group: youtube-core-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and build YouTube core
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run YouTube core tests, lint and debug build
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :lrclib:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:lintVitalUniversalRelease \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Summarize test and lint results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path(".")
          tests = failures = errors = skipped = 0
          for report in sorted(root.glob("*/build/test-results/**/TEST-*.xml")):
              suite = ET.parse(report).getroot()
              tests += int(suite.get("tests", 0))
              failures += int(suite.get("failures", 0))
              errors += int(suite.get("errors", 0))
              skipped += int(suite.get("skipped", 0))
          print(f"Unit tests: {tests}, failures: {failures}, errors: {errors}, skipped: {skipped}")

          for report in sorted(root.glob("app/build/reports/lint-results-*.xml")):
              issues = [
                  issue for issue in ET.parse(report).getroot().findall("issue")
                  if issue.get("severity") in ("Error", "Fatal")
              ]
              print(f"{report.name}: {len(issues)} errors")
              for issue in issues:
                  location = issue.find("location")
                  where = ""
                  if location is not None:
                      where = f"{location.get('file', '')}:{location.get('line', '')}"
                  print(f"{issue.get('id')}: {where}: {issue.get('message')}")
          PY

      # Opt-in visual review for UI commits; no repository writes or device data.
      - name: Export requested UI previews
        if: always() && contains(github.event.head_commit.message, '[ui-review]')
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import pathlib
          previews = pathlib.Path("app/build/reports/ui-previews")
          for name in ("artist-full-portrait.png", "playlist-header.png", "player-background-gallery.png"):
              path = previews / name
              if path.is_file():
                  print("UI_PREVIEW_JSON=" + json.dumps({
                      "name": name,
                      "base64": base64.b64encode(path.read_bytes()).decode("ascii"),
                  }))
          PY

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-core-validation-reports
          path: |
            innertube/build/reports/tests/
            betterlyrics/build/reports/tests/
            lrclib/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/ui-previews/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare validated APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/validated
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            app/build/validated/capsule-music-universal-debug.apk
          sha256sum app/build/validated/capsule-music-universal-debug.apk \
            > app/build/validated/SHA256SUMS.txt

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-music-universal-debug
          path: app/build/validated/
          if-no-files-found: error
          retention-days: 14

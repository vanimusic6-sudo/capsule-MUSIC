            pendingPersistentQueueSaveJob?.cancel()
            pendingPersistentPlayerStateSaveJob?.cancel()
            persistentProgressJob?.cancel()

            val shutdownSnapshot =
                if (dataStore.get(PersistentQueueKey, true)) {

name: Read validation report
on:
  push:
    branches: [cleanup/capsule-player-only]
    paths: [.github/workflows/read-validation-report.yml]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read existing lint errors and UI captures
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/artifacts/10297001271/zip" > report.zip
          python3 - <<'PY'
          import base64, collections, json, zipfile
          import xml.etree.ElementTree as ET
          with zipfile.ZipFile("report.zip") as archive:
              counts = collections.Counter()
              for name in archive.namelist():
                  if name.endswith("lint-results-universalDebug.xml"):
                      root = ET.fromstring(archive.read(name))
                      for issue in root.findall("issue"):
                          if issue.get("severity") in ("Error", "Fatal"):
                              counts[issue.get("id")] += 1
                              print("LINT_ERROR " + json.dumps({
                                  "id": issue.get("id"), "message": issue.get("message"),
                                  "locations": [dict(loc.attrib) for loc in issue.findall("location")]
                              }))
                  if name.endswith(("artist-capsule-header.png", "artist-large-text.png")):
                      data = base64.b64encode(archive.read(name)).decode()
                      for start in range(0, len(data), 3000):
                          print("PREVIEW " + name.rsplit("/", 1)[-1] + " " + data[start:start+3000])
              print("LINT_COUNTS " + json.dumps(counts))
          PY

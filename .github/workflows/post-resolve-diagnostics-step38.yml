name: Post Resolve Diagnostics Step 38

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - .github/workflows/post-resolve-diagnostics-step38.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  step38:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Capture base head
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Apply guarded Step38 wiring
        run: python3 tools/refactor/add_post_resolve_diagnostics_step38.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'addAnalyticsListener(PlaybackLoadDiagnostics)' app/src/main/kotlin/com/nikhil/yt/MusicService.kt
          grep -q 'setTransferListener(PlaybackTransferDiagnostics)' app/src/main/kotlin/com/nikhil/yt/MusicService.kt
          grep -q 'if (!GlobalLog.isEnabled) return' app/src/main/kotlin/com/nikhil/yt/playback/audio/PlaybackLoadDiagnostics.kt
          if grep -Eq 'https?://|responseHeaders|headers|cookie|PoToken' app/src/main/kotlin/com/nikhil/yt/playback/audio/PlaybackLoadDiagnostics.kt; then
            echo 'Step38 diagnostic source contains a forbidden secret/URL logging marker' >&2
            exit 1
          fi

      - name: Validate tests lint and debug build
        run: |
          gradle :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-step38-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error

      - name: Refuse stale write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          REMOTE_SHA=$(git rev-parse origin/cleanup/capsule-player-only)
          if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
            echo "Branch moved during Step38: base=$BASE_SHA remote=$REMOTE_SHA" >&2
            exit 1
          fi

      - name: Commit final Step38 source and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm tools/refactor/add_post_resolve_diagnostics_step38.py
          rm .github/workflows/post-resolve-diagnostics-step38.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add post-resolve playback diagnostics [step38-final]'
          git push origin HEAD:cleanup/capsule-player-only

name: Fix WEB startup prewarm

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - .github/workflows/fix-web-startup-prewarm.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Remove eager WEB prewarm and ignore normal cancellation errors
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path("app/src/main/kotlin/com/nikhil/yt/App.kt")
          text = app.read_text(encoding="utf-8")
          pattern = r"        // Startup WEB prewarm is useful only for profiles that need the\n        // extractor/cipher stack\. VisionOS stays completely cold and direct\.\n        applicationScope\.launch\(Dispatchers\.IO\) \{.*?\n        \}\n\n(?=        applicationScope\.launch\(Dispatchers\.IO\) \{\n            dataStore\.data)"
          text, count = re.subn(pattern, "", text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit(f"expected one eager WEB prewarm block, found {count}")
          app.write_text(text, encoding="utf-8")

          utils = Path("app/src/main/kotlin/com/nikhil/yt/utils/Utils.kt")
          text = utils.read_text(encoding="utf-8")
          old = "fun reportException(throwable: Throwable) {\n    /* Honors the runtime debug-logging switch instead of always writing stderr. */\n    Timber.e(throwable)\n}\n"
          new = "fun reportException(throwable: Throwable) {\n    // Coroutine cancellation is normal control flow (track switch, stale prefetch, shutdown),\n    // not an application error. Do not pollute diagnostics with an E/ stack trace for it.\n    if (throwable is CancellationException) return\n    /* Honors the runtime debug-logging switch instead of always writing stderr. */\n    Timber.e(throwable)\n}\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected reportException block once, found {text.count(old)}")
          utils.write_text(text.replace(old, new), encoding="utf-8")

      - name: Verify production patch
        run: |
          ! grep -q 'startup audio prewarm' app/src/main/kotlin/com/nikhil/yt/App.kt
          ! grep -q 'CapsuleInnerTubeXPlayer.prewarm' app/src/main/kotlin/com/nikhil/yt/App.kt
          grep -q 'if (throwable is CancellationException) return' app/src/main/kotlin/com/nikhil/yt/utils/Utils.kt

      - name: Compile both debug variants
        run: ./gradlew :app:compileUniversalDebugKotlin :app:compileArmeabiDebugKotlin --stacktrace

      - name: Commit production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/nikhil/yt/App.kt app/src/main/kotlin/com/nikhil/yt/utils/Utils.kt
          git diff --cached --check
          git commit -m "Remove eager WEB auth prewarm from playback startup"
          git push origin HEAD:cleanup/capsule-player-only

name: One-shot final audit cleanup

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - .github/workflows/one-shot-audit-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Apply final audit cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # --- M-2: move the 429/bot breaker into the maintained InnerTubeX backend. ---
          path = Path('app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayer.kt')
          text = read(path)
          text = replace_once(
              text,
              'import android.net.ConnectivityManager\n',
              'import android.net.ConnectivityManager\nimport androidx.media3.common.PlaybackException\n',
              'InnerTubeX PlaybackException import',
          )
          text = replace_once(
              text,
              'import com.nikhil.yt.innertube.YouTube\n',
              'import com.nikhil.yt.innertube.YouTube\nimport com.nikhil.yt.innertube.YouTubeFailureClassifier\nimport com.nikhil.yt.innertube.YouTubeFailureKind\n',
              'InnerTubeX failure classifier imports',
          )
          text = replace_once(
              text,
              '    private const val STREAM_CLIENT_FAILURE_TTL_MS = 5 * 60 * 1000L\n',
              '    private const val STREAM_CLIENT_FAILURE_TTL_MS = 5 * 60 * 1000L\n    private const val GLOBAL_BREAKER_MS = 10 * 60 * 1000L\n',
              'InnerTubeX breaker constant',
          )
          text = replace_once(
              text,
              '    @Volatile\n    private var networkGeneration: Long = 0L\n',
              '''    @Volatile
    private var networkGeneration: Long = 0L

    @Volatile
    private var globalPlaybackBreakerUntilMs: Long = 0L

    @Volatile
    private var globalPlaybackBreakerReason: String? = null
''',
              'InnerTubeX breaker state',
          )
          text = replace_once(
              text,
              '        try {\n            val hints =\n',
              '        try {\n            throwIfGlobalBreakerActive()\n            val hints =\n',
              'InnerTubeX breaker gate',
          )
          old_clear = '''    fun clearPlaybackState() {
        streamClientFailures.clear()
        networkGeneration += 1L
    }

    fun onNetworkChanged() {
        streamClientFailures.clear()
        networkGeneration += 1L
    }
'''
          new_clear = '''    fun clearPlaybackState() {
        streamClientFailures.clear()
        clearGlobalBreaker()
        networkGeneration += 1L
    }

    fun onNetworkChanged() {
        streamClientFailures.clear()
        clearGlobalBreaker()
        networkGeneration += 1L
    }

    fun markHttpStreamFailure(
        videoId: String,
        clientName: String?,
        httpStatusCode: Int?,
    ) {
        when (httpStatusCode) {
            429 -> tripGlobalBreaker("YouTube returned HTTP 429")
            401, 403, 410 -> markStreamClientFailed(videoId, clientName)
        }
    }

    fun markBotDetectionFailure(reason: String? = null) {
        tripGlobalBreaker(
            reason =
                reason
                    ?.trim()
                    ?.takeIf { it.isNotBlank() }
                    ?.let { "YouTube bot-check: ${it.take(160)}" }
                    ?: "YouTube requested a bot check",
        )
    }

    fun isBotDetectionException(error: PlaybackException): Boolean {
        val text =
            buildString {
                append(error.message.orEmpty())
                var cause: Throwable? = error.cause
                var depth = 0
                while (cause != null && depth < 5) {
                    append(' ')
                    append(cause.message.orEmpty())
                    cause = cause.cause
                    depth += 1
                }
            }

        return YouTubeFailureClassifier.classify(text = text) == YouTubeFailureKind.BOT_CHECK
    }

    private fun tripGlobalBreaker(reason: String) {
        val until = System.currentTimeMillis() + GLOBAL_BREAKER_MS
        if (until > globalPlaybackBreakerUntilMs) {
            globalPlaybackBreakerUntilMs = until
        }
        globalPlaybackBreakerReason = reason
        Timber.tag(TAG).w(
            "Global YouTube playback breaker opened for %d ms: %s",
            GLOBAL_BREAKER_MS,
            reason,
        )
    }

    private fun clearGlobalBreaker() {
        globalPlaybackBreakerUntilMs = 0L
        globalPlaybackBreakerReason = null
    }

    private fun throwIfGlobalBreakerActive() {
        val until = globalPlaybackBreakerUntilMs
        if (until <= 0L) return
        val now = System.currentTimeMillis()
        if (until <= now) {
            clearGlobalBreaker()
            return
        }

        val remainingSeconds = ((until - now) / 1000L).coerceAtLeast(1L)
        throw PlaybackException(
            buildString {
                append("YouTube playback is cooling down")
                globalPlaybackBreakerReason?.let {
                    append(": ")
                    append(it)
                }
                append(" (")
                append(remainingSeconds)
                append("s)")
            },
            null,
            PlaybackException.ERROR_CODE_REMOTE_ERROR,
        )
    }
'''

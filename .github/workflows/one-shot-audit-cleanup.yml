            httpStatusCode = httpStatusCode,
        )
    }

    fun markBotDetectionFailure'''
          text, count = preferred_pattern.subn(preferred_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'CapsuleAudioEngine preferred client cleanup: expected 1, got {count}')
          text = replace_once(
              text,
              '''    fun markBotDetectionFailure(reason: String? = null) {
        YTPlayerUtils.markBotDetectionFailure(reason)
    }

    fun isBotDetectionException(error: PlaybackException): Boolean =
        YTPlayerUtils.isBotDetectionException(error)
''',
              '''    fun markBotDetectionFailure(reason: String? = null) {
        CapsuleInnerTubeXPlayer.markBotDetectionFailure(reason)
    }

    fun isBotDetectionException(error: PlaybackException): Boolean =
        CapsuleInnerTubeXPlayer.isBotDetectionException(error)
''',
              'CapsuleAudioEngine bot detection routing',
          )
          write(path, text)

          # --- M-2: stop making a second legacy player request for missing loudness. ---
          path = Path('app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt')
          text = read(path)
          text = text.replace('import com.nikhil.yt.utils.YTPlayerUtils\n', '')
          loudness_pattern = re.compile(
              r'    private fun resolveMissingLoudnessInBackground\(.*?\n    fun setCapsulePlaybackMode',

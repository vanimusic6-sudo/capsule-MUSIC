name: Capsule Release UI Polish Regression
on:
  push:
    branches: ['polish/pre-player-release-chrome-20261105']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capsule-release-ui-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-ui-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android compile SDK and locale
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1'
          echo 'unqualifiedResLocale=en-US' > app/src/main/res/resources.properties
      - name: Verify chrome, magnetic handoff, hero, scroll and FAB
        run: |
          gradle :app:testUniversalDebugUnitTest \
            --tests 'com.nikhil.yt.ui.ReleaseChromePolishRegressionTest' \
            --tests 'com.nikhil.yt.ui.CollectionHeaderMotionTest' \
            --tests 'com.nikhil.yt.ui.ArtistHeroTest' \
            --tests 'com.nikhil.yt.ui.HomeScrollableHeaderTest' \
            --tests 'com.nikhil.yt.ui.ArtworkAndScrollMotionTest' \
            --stacktrace --no-daemon --max-workers=2
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-release-ui-polish-reports
          path: |
            app/build/test-results/testUniversalDebugUnitTest/
            app/build/reports/tests/testUniversalDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn

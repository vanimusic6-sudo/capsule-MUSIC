name: Apply adaptive resolve gate

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - .github/workflows/apply-adaptive-resolve-gate.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch MusicService
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt')
          text = path.read_text(encoding='utf-8')
          owner = text.index('    private fun audioResolveJob(')
          start = text.index('            audioResolveStability.awaitStable {', owner)
          end = text.index('            val selection = playbackContext()', start)
          old = text[start:end]
          if 'mediaId in upcomingAudioIds()' not in old or old.count('audioResolveStability.awaitStable') != 1:
              raise SystemExit('unexpected audio resolve gate block')
          lines = [
              '            audioResolveStability.awaitStable(',
              '                requiredDelayMs = {',
              '                    withContext(Dispatchers.Main.immediate) {',
              '                        if (mediaId == player.currentMediaItem?.mediaId) {',
              '                            PLAYBACK_RESOLVE_STABILITY_DELAY_MS',
              '                        } else {',
              '                            PREFETCH_RESOLVE_STABILITY_DELAY_MS',
              '                        }',
              '                    }',
              '                },',
              '            ) {',
              '                withContext(Dispatchers.Main.immediate) {',
              '                    mediaId == player.currentMediaItem?.mediaId ||',
              '                        mediaId in upcomingAudioIds()',
              '                }',
              '            }',
          ]
          new = '\n'.join(lines) + '\n'
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          test "$(grep -c 'requiredDelayMs = {' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt)" -eq 1
          test "$(grep -c 'audioResolveStability.awaitStable' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt)" -eq 2
          git diff --check

      - name: Test adaptive gate
        run: ./gradlew :app:testUniversalDebugUnitTest --tests com.nikhil.yt.playback.PlaybackStabilityGateTest --stacktrace

      - name: Compile debug variants
        run: ./gradlew :app:compileUniversalDebugKotlin :app:compileArmeabiDebugKotlin --stacktrace

      - name: Commit production wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          git diff --cached --check
          git commit -m "Shorten debounce for current audio playback"
          git push origin HEAD:cleanup/capsule-player-only

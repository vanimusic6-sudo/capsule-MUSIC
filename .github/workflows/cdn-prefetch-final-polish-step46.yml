name: CDN Prefetch Final Polish Step 46

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - "tools/refactor/cdn_prefetch_final_polish_step46.py"
      - ".github/workflows/cdn-prefetch-final-polish-step46.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cdn-prefetch-final-polish-step46-${{ github.ref }}
  cancel-in-progress: false

jobs:
  polish:
    name: Apply, validate and commit final AUDIO prefetch polish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Capture base head
        shell: bash
        run: echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Apply step46
        run: python3 tools/refactor/cdn_prefetch_final_polish_step46.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'AUDIO_PREFETCH_LEAD_TIME_MS = 45_000L' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -F 'AUDIO_PREFETCHED_URL_MAX_AGE_MS = 60_000L' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -F 'isPlaying = player.isPlaying' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -F 'getForPlayback' app/src/main/kotlin/com/nikhil/yt/playback/audio/PlaybackDataCache.kt
          grep -F 'stalePrefetchedGenerationIsDroppedBeforePlayback' app/src/test/kotlin/com/nikhil/yt/playback/audio/PlaybackDataCacheTest.kt
          grep -F 'longTrackWaitsUntilJustInTimeLeadWindow' app/src/test/kotlin/com/nikhil/yt/playback/AudioPrefetchSchedulingTest.kt

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run full core validation
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-step46-universal-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Refuse stale write
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/cleanup/capsule-player-only | cut -f1)"
          if [ "$REMOTE_HEAD" != "$BASE_HEAD" ]; then
            echo "Branch moved during validation: base=$BASE_HEAD remote=$REMOTE_HEAD"
            exit 1
          fi

      - name: Commit validated step46
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/refactor/cdn_prefetch_final_polish_step46.py
          rm -f .github/workflows/cdn-prefetch-final-polish-step46.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Polish AUDIO prefetch freshness [step46-final]"
          git push origin HEAD:cleanup/capsule-player-only

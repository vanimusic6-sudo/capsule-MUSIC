name: NewPipeExtractor auto VIDEO build

on:
  workflow_dispatch:
  schedule:
    # Check four times per day. A build only runs when a NEW stable
    # NewPipeExtractor release exists.
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: newpipe-extractor-auto-video-build
  cancel-in-progress: false

jobs:
  update:
    name: Build signed VIDEO-engine candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Discover latest stable NewPipeExtractor
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest="$(
            curl --fail --silent --show-error \
              --retry 3 \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/TeamNewPipe/NewPipeExtractor/releases/latest \
              | jq -r '.tag_name'
          )"

          mapfile -t matches < <(
            sed -n 's/^newpipe-extractor[[:space:]]*=.*version = "\([^"]*\)".*/\1/p' \
              gradle/libs.versions.toml
          )

          if [[ "${#matches[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one active newpipe-extractor line, found ${#matches[@]}"
            exit 1
          fi

          current="${matches[0]}"

          test -n "$latest"
          test "$latest" != "null"

          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

          if [[ "$latest" == "$current" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already current: $current"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Candidate: $current -> $latest"
          fi

      - name: Stop when already current
        if: steps.version.outputs.changed != 'true'
        run: |
          echo "No NewPipeExtractor update is required."

      - name: Check whether this VIDEO build already exists
        if: steps.version.outputs.changed == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          tag="video-engine-$LATEST"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pinned extractor and in-app engine version
        if: steps.version.outputs.changed == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          latest = os.environ["LATEST"]

          catalog = Path("gradle/libs.versions.toml")
          catalog_text = catalog.read_text(encoding="utf-8")
          catalog_new, count = re.subn(
              r'(?m)^(newpipe-extractor\s*=\s*\{[^\n]*version\s*=\s*")[^"]+("[^\n]*\})',
              rf'\g<1>{latest}\2',
              catalog_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not update NewPipeExtractor in libs.versions.toml")
          catalog.write_text(catalog_new, encoding="utf-8")

          updater = Path(
              "app/src/main/kotlin/com/nikhil/yt/playback/video/"
              "CapsuleVideoEngineUpdater.kt"
          )
          updater_text = updater.read_text(encoding="utf-8")
          updater_new, count = re.subn(
              r'(?m)^(\s*const val BUNDLED_EXTRACTOR_VERSION\s*=\s*")[^"]+(")',
              rf'\g<1>{latest}\2',
              updater_text,
              count=1,
          )
          if count != 1:
              raise SystemExit(
                  "Could not update BUNDLED_EXTRACTOR_VERSION "
                  "in CapsuleVideoEngineUpdater.kt"
              )
          updater.write_text(updater_new, encoding="utf-8")
          PY

          grep -n '^newpipe-extractor' gradle/libs.versions.toml
          grep -n 'BUNDLED_EXTRACTOR_VERSION' \
            app/src/main/kotlin/com/nikhil/yt/playback/video/CapsuleVideoEngineUpdater.kt

      - name: Compile-test candidate
        if: steps.version.outputs.changed == 'true' && steps.existing.outputs.exists != 'true'
        run: |
          gradle :innertube:test :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Create reproducible source commit
        if: steps.version.outputs.changed == 'true' && steps.existing.outputs.exists != 'true'
        id: source
        shell: bash
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail

          branch="video-engine/$LATEST"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add \
            gradle/libs.versions.toml \
            app/src/main/kotlin/com/nikhil/yt/playback/video/CapsuleVideoEngineUpdater.kt

          git commit -m "Build VIDEO engine with NewPipeExtractor $LATEST"
          git push --force origin "$branch"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore release keystore
        if: steps.version.outputs.changed == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "::error::KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          mkdir -p app/keystore
          printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' \
            | base64 --decode \
            > app/keystore/release.keystore

          test -s app/keystore/release.keystore

          keytool -list \
            -keystore app/keystore/release.keystore \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

      - name: Prepare locale metadata
        if: steps.version.outputs.changed == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Build signed Universal Release APK
        if: steps.version.outputs.changed == 'true' && steps.existing.outputs.exists != 'true'
        run: |
          gradle :app:assembleUniversalRelease \
            --stacktrace \
            --no-daemon

      - name: Prepare predictable APK asset
        if: steps.version.outputs.changed == 'true' && steps.existing.outputs.exists != 'true'
        id: apk
        shell: bash
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail

          source_apk="$(
            find app/build/outputs/apk/universal/release \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          test -n "$source_apk"
          test -s "$source_apk"

          asset="Capsule-MUSIC-VIDEO-Engine-$LATEST.apk"
          cp "$source_apk" "$asset"

          echo "path=$asset" >> "$GITHUB_OUTPUT"

          echo "APK: $asset"
          sha256sum "$asset"

      - name: Verify APK signature
        if: steps.version.outputs.changed == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "${{ steps.apk.outputs.path }}"

      - name: Tag exact source commit
        if: steps.version.outputs.changed == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail

          tag="video-engine-$LATEST"
          git tag -f "$tag" "${{ steps.source.outputs.commit }}"
          git push --force origin "refs/tags/$tag"

      - name: Publish signed VIDEO-engine prerelease
        if: steps.version.outputs.changed == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.version.outputs.latest }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail

          tag="video-engine-$LATEST"

          gh release create "$tag" \
            "${{ steps.apk.outputs.path }}" \
            --prerelease \
            --title "Capsule VIDEO Engine $LATEST" \
            --notes "$(cat <<EOF
          Automatic Capsule VIDEO-engine build.

          NewPipeExtractor: $CURRENT -> $LATEST

          Safety model:
          - full Capsule APK, signed with the normal Capsule release key;
          - no runtime JAR/DEX loading;
          - NewPipeExtractor remains inside the isolated :capsule_video process;
          - candidate passed :innertube:test and :app:assembleUniversalDebug;
          - the final Universal Release APK signature was verified before publishing.

          Android still asks the user to confirm installation.
          EOF
          )"

      - name: Remove keystore
        if: always()
        shell: bash
        run: |
          rm -f app/keystore/release.keystore

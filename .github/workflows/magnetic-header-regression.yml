name: Capsule Detail Motion / Scroll Regression
on:
  push:
    branches:
      - 'fix/magnetic-chrome-and-library-fab-20261105'
      - 'fix/detail-hairline-center-reveal-20261107'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: capsule-magnetic-header-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Prepare compile SDK and locale
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1'
          echo 'unqualifiedResLocale=en-US' > app/src/main/res/resources.properties
      - name: Test title dissolve, scroll ownership, library save, artist matte and chrome
        run: |
          gradle :app:testUniversalDebugUnitTest \
            --tests 'com.nikhil.yt.ui.ReleaseChromePolishRegressionTest' \
            --tests 'com.nikhil.yt.ui.CollectionHeaderMotionTest' \
            --tests 'com.nikhil.yt.ui.component.DetailToolbarRevealTest' \
            --tests 'com.nikhil.yt.ui.ArtistHeroTest' \
            --tests 'com.nikhil.yt.ui.HomeScrollableHeaderTest' \
            --tests 'com.nikhil.yt.ui.ScrollFlingCatchRegressionTest' \
            --tests 'com.nikhil.yt.ui.ArtworkAndScrollMotionTest' \
            --stacktrace --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capsule-magnetic-header-test-reports
          path: |
            app/build/test-results/testUniversalDebugUnitTest/
            app/build/reports/tests/testUniversalDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn

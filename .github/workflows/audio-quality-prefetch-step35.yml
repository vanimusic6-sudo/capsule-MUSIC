name: Audio Quality And Prefetch Step 35

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/audio-quality-prefetch-step35.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-quality-prefetch-step35
  cancel-in-progress: false

jobs:
  patch-test-and-push:
    if: github.actor != 'github-actions[bot]'
    name: Remove duplicate max quality and harden foreground resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Apply guarded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/refactor/fix_audio_quality_prefetch_step35.py --check
          python3 tools/refactor/fix_audio_quality_prefetch_step35.py
          git diff --check

          ! grep -Fq 'stringResource(R.string.audio_quality_max)' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt
          grep -Fq 'AudioQuality.HIGHEST) AudioQuality.HIGH' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -Fq 'promotedPrefetchRestartAfterMs' app/src/main/kotlin/com/nikhil/yt/playback/audio/AudioResolveScheduler.kt
          grep -Fq 'stalePrefetchPromotionRestartsAsForeground' app/src/test/kotlin/com/nikhil/yt/playback/audio/AudioResolveSchedulerTest.kt

      - name: Full validation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-step35-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Commit final source and remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/refactor/fix_audio_quality_prefetch_step35.py
          rm -f .github/workflows/audio-quality-prefetch-step35.yml
          git diff --check
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix duplicate max quality and foreground resolve stalls [step35-final]"
          git push origin HEAD:cleanup/capsule-player-only

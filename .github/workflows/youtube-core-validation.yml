name: YouTube Core Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/kotlin/com/nikhil/yt/playback/**"
      - "app/src/main/kotlin/com/nikhil/yt/extensions/**"
      - "app/src/main/kotlin/com/nikhil/yt/utils/**"
      - "app/src/main/kotlin/com/nikhil/yt/di/**"
      - "app/src/main/kotlin/com/nikhil/yt/App.kt"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/StorageSettings.kt"
      - "app/src/test/**"
      - "innertube/src/main/**"
      - "innertube/src/test/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/youtube-core-validation.yml"
  push:
    branches:
      - main
    paths:
      - "app/src/main/kotlin/com/nikhil/yt/playback/**"
      - "app/src/main/kotlin/com/nikhil/yt/extensions/**"
      - "app/src/main/kotlin/com/nikhil/yt/utils/**"
      - "app/src/main/kotlin/com/nikhil/yt/di/**"
      - "app/src/main/kotlin/com/nikhil/yt/App.kt"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/StorageSettings.kt"
      - "app/src/test/**"
      - "innertube/src/main/**"
      - "innertube/src/test/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/youtube-core-validation.yml"

permissions:
  contents: write

concurrency:
  group: youtube-core-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build YouTube core
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply final runtime hardening
        if: github.event_name == 'pull_request' && github.head_ref == 'cleanup/capsule-player-only'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path("app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt")
          settings_path = Path("app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt")

          service = service_path.read_text()
          settings = settings_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          # Remove the final source dependency on the retired resolver.
          service = replace_once(
              service,
              "import com.nikhil.yt.utils.YTPlayerUtils\n",
              "",
              "YTPlayerUtils import",
          )

          # Both main and overlap players are background audio players. NETWORK
          # wake mode holds a WifiLock (high-power on API <=33); LOCAL is the
          # Media3-recommended mode for a foreground playback service.
          wake_old = ".setWakeMode(C.WAKE_MODE_NETWORK)"
          wake_count = service.count(wake_old)
          if wake_count != 2:
              raise SystemExit(f"wake mode: expected 2 NETWORK builders, found {wake_count}")
          service = service.replace(wake_old, ".setWakeMode(C.WAKE_MODE_LOCAL)")

          service = replace_once(
              service,
              "                    setOffloadEnabled(false)\n",
              "                    setOffloadEnabled(dataStore.get(AudioOffload, true))\n",
              "initial offload",
          )
          service = replace_once(
              service,
              "            val offload = prefs[AudioOffload] ?: false\n",
              "            val offload = prefs[AudioOffload] ?: true\n",
              "snapshot offload default",
          )
          service = replace_once(
              service,
              "            .map { it[AudioOffload] ?: false }\n",
              "            .map { it[AudioOffload] ?: true }\n",
              "flow offload default",
          )

          # The legacy secondary loudness lookup already returned null and only
          # kept jobs/maps alive. Playback metadata + DB are the only sources.
          service = replace_once(
              service,
              "    private val normalizationLookupBlockedUntil =\n        ConcurrentHashMap<String, Long>()\n    private val normalizationLookupJobs =\n        ConcurrentHashMap<String, Job>()\n\n",
              "",
              "normalization lookup state",
          )
          service = replace_once(
              service,
              "            if (!normalizeAudio) {\n                normalizationLookupJobs.values.forEach { it.cancel() }\n                normalizationLookupJobs.clear()\n            }\n",
              "",
              "normalization lookup cancellation",
          )

          old_missing_loudness = '''                if (\n                    loudnessDb == null &&\n                    perceptualLoudnessDb == null &&\n                    audioNormalizationEnabled.value\n                ) {\n                    Timber.tag("AudioNormalization").w("No loudness data available from YouTube for video: $mediaId")\n                    resolveMissingLoudnessInBackground(\n                        mediaId = mediaId,\n                        format = format,\n                        playbackUrl =\n                            nonNullPlayback.playbackTracking\n                                ?.videostatsPlaybackUrl\n                                ?.baseUrl,\n                    )\n                }\n'''
          new_missing_loudness = '''                if (\n                    loudnessDb == null &&\n                    perceptualLoudnessDb == null &&\n                    audioNormalizationEnabled.value\n                ) {\n                    Timber.tag("AudioNormalization").d(\n                        "No loudness metadata for %s; keeping unity gain without a second player request",\n                        mediaId,\n                    )\n                }\n'''
          service = replace_once(
              service,
              old_missing_loudness,
              new_missing_loudness,
              "secondary loudness call",
          )

          loudness_start = service.find("    private fun resolveMissingLoudnessInBackground(")
          loudness_end = service.find("    fun setCapsulePlaybackMode(", loudness_start)
          if loudness_start < 0 or loudness_end < 0:
              raise SystemExit("secondary loudness function markers not found")
          service = service[:loudness_start] + service[loudness_end:]

          # Modern Media3 offload is fully implemented by the extension. Remove
          # stale reflection against APIs that no longer exist in Media3 1.9.
          offload_start = service.find("    private fun updateAudioOffload(enabled: Boolean) {")
          renderer_start = service.find("    private fun createRenderersFactory()", offload_start)
          if offload_start < 0 or renderer_start < 0:
              raise SystemExit("offload function markers not found")
          service = (
              service[:offload_start]
              + "    private fun updateAudioOffload(enabled: Boolean) {\n"
                "        player.setOffloadEnabled(enabled)\n"
                "    }\n\n"
              + service[renderer_start:]
          )

          # The custom processor chain is PCM-only in Media3. The default sink
          # already supplies silence/speed processors when needed and can be
          # bypassed cleanly for hardware offload.
          renderer_start = service.find("    private fun createRenderersFactory()")
          stats_start = service.find("    override fun onPlaybackStatsReady(", renderer_start)
          if renderer_start < 0 or stats_start < 0:
              raise SystemExit("renderer function markers not found")
          service = (
              service[:renderer_start]
              + "    private fun createRenderersFactory() = DefaultRenderersFactory(this)\n\n"
              + service[stats_start:]
          )

          for unused_import in (
              "import androidx.media3.common.audio.SonicAudioProcessor\n",
              "import androidx.media3.exoplayer.audio.DefaultAudioSink\n",
              "import androidx.media3.exoplayer.audio.SilenceSkippingAudioProcessor\n",
          ):
              if unused_import not in service:
                  raise SystemExit(f"expected import missing: {unused_import.strip()}")
              service = service.replace(unused_import, "", 1)

          # Preserve structured cancellation in the deferred queue loader.
          service = replace_once(
              service,
              '''                        } catch (e: Exception) {\n                            Timber.e(e, "Failed to load deferred queue items")\n                        }\n''',
              '''                        } catch (e: kotlinx.coroutines.CancellationException) {\n                            throw e\n                        } catch (e: Exception) {\n                            Timber.e(e, "Failed to load deferred queue items")\n                        }\n''',
              "deferred queue cancellation",
          )

          # A Throwable catch in playback recovery must never consume coroutine
          # cancellation.
          service = replace_once(
              service,
              '''                } catch (t: Throwable) {\n                    Timber.tag("MusicService").e(t, "failed to recover from silence-skipper error")\n                }\n''',
              '''                } catch (t: Throwable) {\n                    if (t is kotlinx.coroutines.CancellationException) throw t\n                    Timber.tag("MusicService").e(t, "failed to recover from silence-skipper error")\n                }\n''',
              "silence recovery cancellation",
          )

          # Listening-history jobs belong to the service lifecycle instead of
          # anonymous process-wide scopes.
          detached = "            CoroutineScope(Dispatchers.IO).launch {\n"
          detached_count = service.count(detached)
          if detached_count != 2:
              raise SystemExit(f"history scopes: expected 2 detached scopes, found {detached_count}")
          service = service.replace(detached, "            ioScope.launch {\n")

          service = replace_once(
              service,
              '''            ioScope.launch {\n                runCatching { registerRemoteListeningHistory(mediaItem.mediaId) }\n            }\n''',
              '''            ioScope.launch {\n                try {\n                    registerRemoteListeningHistory(mediaItem.mediaId)\n                } catch (cancelled: kotlinx.coroutines.CancellationException) {\n                    throw cancelled\n                } catch (error: Exception) {\n                    Timber.tag("MusicService").v(error, "Remote listening-history sync failed")\n                }\n            }\n''',
              "remote history cancellation",
          )

          # UI and service now agree on the efficient default before the first
          # DataStore emission. Explicit false remains respected.
          settings = replace_once(
              settings,
              '''    val (audioOffload, onAudioOffloadChange) =\n        rememberPreference(\n            AudioOffload,\n            defaultValue = false,\n        )\n''',
              '''    val (audioOffload, onAudioOffloadChange) =\n        rememberPreference(\n            AudioOffload,\n            defaultValue = true,\n        )\n''',
              "PlayerSettings offload default",
          )

          # Final guards: the service may no longer reference the retired
          # resolver or the high-power Wi-Fi wake mode.
          if "YTPlayerUtils" in service:
              raise SystemExit("YTPlayerUtils reference remains in MusicService")
          if "WAKE_MODE_NETWORK" in service:
              raise SystemExit("WAKE_MODE_NETWORK remains in MusicService")
          if "resolveMissingLoudnessInBackground" in service:
              raise SystemExit("secondary loudness resolver remains in MusicService")

          service_path.write_text(service)
          settings_path.write_text(settings)
          PY

          if git diff --quiet -- \
            app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt \
            app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt; then
            echo "Runtime hardening already applied"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt \
            app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt
          git commit -m "Finish runtime power and cancellation hardening"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run YouTube core tests and debug build
        run: |
          gradle \
            :innertube:test \
            :app:testUniversalDebugUnitTest \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

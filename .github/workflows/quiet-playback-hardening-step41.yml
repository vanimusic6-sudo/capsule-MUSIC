name: Quiet Playback Hardening Step 41

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/quiet-playback-hardening-step41.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quiet-playback-hardening-step41
  cancel-in-progress: false

jobs:
  harden:
    name: Harden playback pacing, test, lint and commit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Capture base head
        shell: bash
        run: echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Apply step41 hardening
        run: python3 tools/refactor/quiet_playback_hardening_step41.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'MAX_FOREGROUND_ATTEMPTS = 3' app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleAudioFallbackPolicy.kt
          grep -q '1_000L' app/src/main/kotlin/com/nikhil/yt/playback/CapsuleLoadErrorHandlingPolicy.kt
          grep -q 'MetrolistGroup/faraday/master/registry/player_configs.json' app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayer.kt
          grep -q 'distinctUntilChanged().collectLatest(scope) { (loudness, normalizeAudio)' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -q 'fallbackDelayMs' app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayer.kt

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run full core validation
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-universal-debug-step41
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Refuse stale write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          REMOTE_HEAD="$(git rev-parse origin/cleanup/capsule-player-only)"
          if [ "$REMOTE_HEAD" != "$BASE_HEAD" ]; then
            echo "Branch moved during validation: base=$BASE_HEAD remote=$REMOTE_HEAD" >&2
            exit 1
          fi

      - name: Commit validated hardening and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/quiet-playback-hardening-step41.yml
          rm -f tools/refactor/quiet_playback_hardening_step41.py
          git add -A
          if git diff --cached --quiet; then
            echo "No validated changes to commit" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Harden playback backpressure and CDN recovery [step41-final]"
          git push origin HEAD:cleanup/capsule-player-only

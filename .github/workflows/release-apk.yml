name: Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - next/capsule-clay
      - perf/thermal-audit-20261005
      - feature/video-isolated-thermal-20261010-v2
      - fix/video-stable-incremental-20261011
      - refactor/video-session-rebuild-20261011
      - fix/video-state-audio-maintenance-20261014
      - polish/video-immersion-jelly-audio-cdn-20261014
      - polish/velocity-sticky-video-20261014
      - fix/video-consistent-width-soft-corners-20261014
      - fix/immersion-close-artwork-energy-20261014
      - fix/video-cover-stability-independent-size-20261014
      - fix/video-dissolve-opaque-cover-20261015
      - polish/lyrics-menu-motion-20261015
      - polish/lyrics-jelly-menu-gestures-immersion-seam-20261015
      - fix/original-more-jelly-smooth-lyrics-20261015
      - fix/predictive-back-and-lyrics-transition-20261015
      - polish/motion-sheet-lyrics-60hz-20261015
      - polish/lyrics-aperture-morph-20261015
      - polish/lyrics-ink-immersion-true-edge-20261015
      - fix/immersive-smoked-gradient-lyrics-fog-20261016
      - fix/immersion-soft-staged-shading-static-ink-20261016
      - fix/immersion-clean-photo-to-ink-20261016
      - fix/immersion-continuous-photo-to-floor-20261016
      - fix/immersion-return-sampled-muted-colour-20261016
      - fix/immersion-restore-original-white-soft-only-20261016
      - audit/global-motion-physics-energy-20261017
      - feature/settings-motion-physics-20261017
      - feature/settings-motion-v2-20261017
      - fix/settings-motion-recording-9467-20261017
      - fix/settings-header-motion-smooth-energy-20261017
      - fix/settings-motion-header-standalone-20261017
      - fix/motion-9481-nav-dialogs-priorities-20261018
      - fix/archive-settings-nav-dialog-exit-20261018
      - polish/settings-section-modal-switch-motion-20261018
      - polish/soft-motion-thermal-header-9496-20261018
      - fix/header-reveal-soft-nav-together-toggle-20261018
      - fix/inline-scroll-header-together-no-ripple-20261018
      - fix/feed-header-status-inset-20261018
      - refactor/spotify-pinned-header-20261018
      - fix/pinned-header-color-settings-transition-20261018
      - fix/video-timeline-morph-20261014

permissions:
  contents: read

concurrency:
  group: capsule-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build signed Universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' \
            | base64 --decode \
            > app/keystore/release.keystore

          test -s app/keystore/release.keystore

      - name: Verify keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore app/keystore/release.keystore \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > /dev/null

          echo "Release keystore OK"

      - name: Prepare locale metadata
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Build Universal Release APK
        run: |
          gradle :app:verifyAndroidJsonRuntime :app:assembleUniversalRelease \
            --stacktrace \
            --no-daemon

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/universal/release \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          test -n "$APK"
          test -s "$APK"

          echo "path=$APK" >> "$GITHUB_OUTPUT"

          echo "APK:"
          echo "$APK"

          echo "SHA-256:"
          sha256sum "$APK"

      - name: Verify platform JSON in optimized release
        shell: bash
        run: |
          set -euo pipefail
          MAPPING=app/build/outputs/mapping/universalRelease/mapping.txt
          test -s "$MAPPING"
          if rg -n '^org\.json\.[^ ]+ -> ' "$MAPPING"; then
            echo 'Desktop JSON classes entered the optimized Android APK'
            exit 1
          fi
          echo 'Optimized release uses platform JSON classes'

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "${{ steps.apk.outputs.path }}"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-MUSIC-Universal-Release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload release mapping
        uses: actions/upload-artifact@v4
        with:
          name: Capsule-MUSIC-Release-Mapping
          path: app/build/outputs/mapping/universalRelease/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        shell: bash
        run: |
          rm -f app/keystore/release.keystore

name: Baseline Build

on:
  push:
    branches:
      - ci/baseline-build
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Test, lint and signed release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout clean source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.KEYSTORE_BASE64 }}" || { echo "KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "STORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "KEY_PASSWORD is missing"; exit 1; }

      - name: Restore release keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/keystore
          printf '%s' '${{ secrets.KEYSTORE_BASE64 }}' | base64 --decode > app/keystore/release.keystore
          test -s app/keystore/release.keystore

      - name: Verify keystore before build
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore app/keystore/release.keystore \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          echo "Release keystore and alias are valid"

      - name: Show build tool versions
        run: |
          java -version
          gradle --version

      - name: Unit tests
        run: gradle :app:testUniversalDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        run: gradle :app:lintUniversalDebug --stacktrace --no-daemon

      - name: Build signed Universal Release
        run: gradle :app:assembleUniversalRelease --stacktrace --no-daemon

      - name: Locate release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/universal/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"
          sha256sum "$APK"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "${{ steps.apk.outputs.path }}"

      - name: Upload baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-music-baseline-universal-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-music-baseline-lint
          path: |
            app/build/reports/lint-results-universalDebug.html
            app/build/reports/lint-results-universalDebug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove restored keystore
        if: always()
        shell: bash
        run: rm -f app/keystore/release.keystore

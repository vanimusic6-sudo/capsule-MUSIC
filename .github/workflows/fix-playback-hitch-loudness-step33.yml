name: Fix Playback Hitch And Loudness Step 33

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - "tools/refactor/fix_playback_hitch_and_loudness_step33.py"
      - ".github/workflows/fix-playback-hitch-loudness-step33.yml"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[step33-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Capture starting branch head
        shell: bash
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply playback and loudness fixes
        run: python3 tools/refactor/fix_playback_hitch_and_loudness_step33.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NORMALIZATION_TARGET_LUFS = -14.0' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -q 'future resolves updated, current playback preserved' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -q '%.2f LUFS' app/src/main/kotlin/com/nikhil/yt/ui/utils/ShowMediaInfo.kt
          python3 - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt').read_text()
          start = text.index('private fun reloadAudioForClientChange(policy: AudioStreamPolicy)')
          end = text.index('private fun recreateAudioSources', start)
          block = text[start:end]
          assert 'player.stop()' not in block
          assert 'recreateAudioSources' not in block
          assert 'prefetchUpcomingAudio()' in block
          PY

      - name: Run full validation
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          REMOTE_SHA="$(git rev-parse origin/cleanup/capsule-player-only)"
          if [ "$REMOTE_SHA" != "$START_SHA" ]; then
            echo "Branch moved during validation: start=$START_SHA remote=$REMOTE_SHA" >&2
            exit 1
          fi

      - name: Commit validated fixes and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          rm tools/refactor/fix_playback_hitch_and_loudness_step33.py
          rm .github/workflows/fix-playback-hitch-loudness-step33.yml
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix playback client switching and loudness normalization [step33-final]"
          git push origin HEAD:cleanup/capsule-player-only

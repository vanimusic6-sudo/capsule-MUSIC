name: Final Playback Polish Step 28

on:
  push:
    branches: [cleanup/capsule-player-only]
    paths: [".github/workflows/final-polish-step28.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-playback-polish-step28
  cancel-in-progress: false

jobs:
  polish:
    name: Guard offload during crossfade and validate final branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            printf 'unqualifiedResLocale=en-US\n' > app/src/main/res/resources.properties
          fi

      - name: Verify review state
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          SYNC=app/src/main/kotlin/com/nikhil/yt/utils/SyncUtils.kt
          grep -Fq 'player.setOffloadEnabled(enabled)' "$SERVICE"
          test "$(grep -Fc 'crossfadeDurationMs.value = it' "$SERVICE")" = "1"
          ! grep -Fq 'shouldEnableAudioOffload(' "$SERVICE"
          grep -Fq 'const val AUTO_SYNC_MIN_INTERVAL_MS = 60_000L' "$SYNC"
          grep -Fq 'claimAutomaticSync(AUTO_SYNC_LIKED_SONGS)' "$SYNC"
          grep -Fq 'claimAutomaticSync(AUTO_SYNC_LIBRARY_SONGS)' "$SYNC"
          grep -Fq 'claimAutomaticSync(AUTO_SYNC_LIKED_ALBUMS)' "$SYNC"
          grep -Fq 'claimAutomaticSync(AUTO_SYNC_ARTISTS)' "$SYNC"
          grep -Fq 'syncLikedSongs(automatic = true)' app/src/main/kotlin/com/nikhil/yt/ui/screens/library/LibrarySongsScreen.kt
          grep -Fq 'syncLibrarySongs(automatic = true)' app/src/main/kotlin/com/nikhil/yt/ui/screens/library/LibrarySongsScreen.kt
          grep -Fq 'viewModel.sync(automatic = true)' app/src/main/kotlin/com/nikhil/yt/ui/screens/library/LibraryAlbumsScreen.kt
          grep -Fq 'viewModel.sync(automatic = true)' app/src/main/kotlin/com/nikhil/yt/ui/screens/library/LibraryArtistsScreen.kt

      - name: Apply D-1 and unit test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          service_path = Path('app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt')
          service = service_path.read_text()

          class_marker = '\n@OptIn(ExperimentalCoroutinesApi::class, FlowPreview::class)\n'
          if service.count(class_marker) != 1:
              raise SystemExit('MusicService class marker is not unique')
          helper = '''
          internal fun shouldEnableAudioOffload(
              requested: Boolean,
              crossfadeDurationMs: Int,
          ): Boolean = requested && crossfadeDurationMs == 0
          '''
          service = service.replace(class_marker, '\n' + helper + class_marker, 1)

          crossfade_line = '                crossfadeDurationMs.value = it\n'
          if service.count(crossfade_line) != 1:
              raise SystemExit('crossfade assignment is not unique')
          service = service.replace(
              crossfade_line,
              crossfade_line
              + '                // Crossfade requires software mixing, so offload must stop immediately.\n'
              + '                updateAudioOffload(dataStore.get(AudioOffload, true))\n',
              1,
          )

          offload_line = '        player.setOffloadEnabled(enabled)\n'
          if service.count(offload_line) != 1:
              raise SystemExit('offload assignment is not unique')
          service = service.replace(
              offload_line,
              '''        player.setOffloadEnabled(
              shouldEnableAudioOffload(
                  requested = enabled,
                  crossfadeDurationMs = crossfadeDurationMs.value,
              ),
          )
          ''',
              1,
          )
          service_path.write_text(service)

          test_path = Path('app/src/test/kotlin/com/nikhil/yt/playback/AudioNormalizationTest.kt')
          test = test_path.read_text()
          if 'offloadIsDisabledWhileCrossfadeIsActive' in test:
              raise SystemExit('offload test already exists')
          import_line = 'import org.junit.Assert.assertEquals\n'
          if test.count(import_line) != 1:
              raise SystemExit('JUnit import anchor changed')
          test = test.replace(
              import_line,
              import_line + 'import org.junit.Assert.assertFalse\nimport org.junit.Assert.assertTrue\n',
              1,
          )
          addition = '''

              @Test
              fun offloadIsDisabledWhileCrossfadeIsActive() {
                  assertTrue(shouldEnableAudioOffload(requested = true, crossfadeDurationMs = 0))
                  assertFalse(shouldEnableAudioOffload(requested = true, crossfadeDurationMs = 1_000))
                  assertFalse(shouldEnableAudioOffload(requested = false, crossfadeDurationMs = 0))
              }
          '''
          closing = test.rfind('\n}')
          if closing < 0:
              raise SystemExit('test class closing brace not found')
          test = test[:closing] + addition + test[closing:]
          test_path.write_text(test)
          PY

      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          SERVICE=app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -Fq 'internal fun shouldEnableAudioOffload(' "$SERVICE"
          grep -Fq 'requested && crossfadeDurationMs == 0' "$SERVICE"
          grep -Fq 'updateAudioOffload(dataStore.get(AudioOffload, true))' "$SERVICE"
          grep -Fq 'offloadIsDisabledWhileCrossfadeIsActive' app/src/test/kotlin/com/nikhil/yt/playback/AudioNormalizationTest.kt
          git diff --check

      - name: Run unit tests, lint and debug build
        run: |
          gradle :app:testUniversalDebugUnitTest :app:lintUniversalDebug :app:assembleUniversalDebug --stacktrace --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          test "$(git rev-parse origin/cleanup/capsule-player-only)" = "$GITHUB_SHA"

      - name: Commit validated polish and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          git config user.name capsule-refactor-bot
          git config user.email actions@users.noreply.github.com
          git rm .github/workflows/final-polish-step28.yml
          git add app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt app/src/test/kotlin/com/nikhil/yt/playback/AudioNormalizationTest.kt
          git commit -m 'Guard audio offload during crossfade'
          git push origin HEAD:cleanup/capsule-player-only

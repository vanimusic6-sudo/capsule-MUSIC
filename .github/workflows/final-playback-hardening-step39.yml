name: Final Playback Hardening Step 39

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - .github/workflows/final-playback-hardening-step39.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Capture base head
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Apply final hardening patch
        run: python3 tools/refactor/final_playback_hardening_step39.py

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'if (httpStatusCode == 429) return C.TIME_UNSET' app/src/main/kotlin/com/nikhil/yt/playback/CapsuleLoadErrorHandlingPolicy.kt
          grep -q 'urlFp=%s' app/src/main/kotlin/com/nikhil/yt/playback/audio/AudioNetworkDiagnosticDataSource.kt
          grep -q 'isAudioOffloadRequested' app/src/main/kotlin/com/nikhil/yt/extensions/ExoPlayerExtensions.kt
          grep -q 'Disabled audio offload after current format/output became unsupported' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -q 'isYouTubeMusicLoginPage(url)' app/src/main/kotlin/com/nikhil/yt/ui/screens/LoginScreen.kt
          if grep -nE 'cdn-(open|read).*(https?://|[?&](sig|lsig|token|pot)=)' app/src/main/kotlin/com/nikhil/yt/playback/audio/AudioNetworkDiagnosticDataSource.kt; then
            echo 'Audio CDN diagnostics must not log raw signed URLs or tokens' >&2
            exit 1
          fi

      - name: Refuse stale write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          REMOTE_SHA=$(git rev-parse origin/cleanup/capsule-player-only)
          if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
            echo "Branch moved during finalization: base=$BASE_SHA remote=$REMOTE_SHA" >&2
            exit 1
          fi

      - name: Commit final source and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          rm tools/refactor/final_playback_hardening_step39.py
          rm .github/workflows/final-playback-hardening-step39.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish playback hardening before UI work [step39-final]'
          git push origin HEAD:cleanup/capsule-player-only

    private fun writePersistentPlaybackSnapshot'''
          text, count = capture_pattern.subn(capture_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Persistence capture formatting: expected 1, got {count}')

          malformed_on_destroy = '''        /*
     * onDestroy runs on the main thread. Never fsync the queue here.

name: Apply playback review fix

on:
  push:
    branches:
      - cleanup/capsule-player-only

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("tools/review_fix_once.py")
          text = p.read_text()
          old = '''            val profileId =
                onlyPostBotProfile
                    ?.takeIf { it !in attempted && it in plan }
                    ?: plan.firstOrNull { it !in attempted }
                    ?: throw lastFailure
                    ?: IllegalStateException(
                        if (priorityBeforeAttempt == AudioResolvePriority.PLAYBACK) {
                            "No safe AUDIO client profile is currently available"
                        } else {
                            "AUDIO background resolve suppressed while its primary profile is quarantined"
                        },
                    )

            attempted += profileId
'''
          new = '''            val profileId =
                onlyPostBotProfile
                    ?.takeIf { it !in attempted && it in plan }
                    ?: plan.firstOrNull { it !in attempted }
                    ?: run {
                        lastFailure?.let { throw it }
                        throw IllegalStateException(
                            if (priorityBeforeAttempt == AudioResolvePriority.PLAYBACK) {
                                "No safe AUDIO client profile is currently available"
                            } else {
                                "AUDIO background resolve suppressed while its primary profile is quarantined"
                            },
                        )
                    }

            attempted += profileId
'''
          if old not in text:
              raise SystemExit("temporary patch script profile block not found")
          p.write_text(text.replace(old, new, 1))
          PY
          python3 tools/review_fix_once.py

      - name: Verify focused tests and compile
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :app:testUniversalDebugUnitTest \
            --tests 'com.nikhil.yt.playback.audio.AudioResolveSchedulerTest' \
            :app:compileUniversalDebugKotlin \
            --stacktrace \
            --no-daemon

      - name: Commit fixes and remove temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/review-a0-a4-once.yml tools/review_fix_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix foreground audio fallback promotion and stale cancellation"
          git push origin HEAD:cleanup/capsule-player-only

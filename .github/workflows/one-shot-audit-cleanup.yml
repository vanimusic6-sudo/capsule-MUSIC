          )
          release_fn = re.compile(r'suspend fun fetchReleaseNotesText\(\): List<String> \{.*\}\s*$', re.S)
          release_new = '''suspend fun fetchReleaseNotesText(): List<String> {
    val result = Updater.getLatestReleaseNotes()
    val error = result.exceptionOrNull()
    if (error != null) {
        if (error is CancellationException) throw error
        return listOf("Error loading release notes")
    }

    return result
        .getOrNull()
        .orEmpty()
        .lines()
        .map { it.trim() }
        .filter { it.isNotEmpty() }
        .ifEmpty { listOf("No release notes found") }
}
'''
          text, count = release_fn.subn(release_new, text, count=1)

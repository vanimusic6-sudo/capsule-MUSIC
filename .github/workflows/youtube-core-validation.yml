name: YouTube Core Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/kotlin/com/nikhil/yt/playback/**"
      - "app/src/main/kotlin/com/nikhil/yt/utils/**"
      - "app/src/main/kotlin/com/nikhil/yt/di/**"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/StorageSettings.kt"
      - "app/src/test/**"
      - "innertube/src/main/**"
      - "innertube/src/test/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/youtube-core-validation.yml"
  push:
    branches:
      - main
    paths:
      - "app/src/main/kotlin/com/nikhil/yt/playback/**"
      - "app/src/main/kotlin/com/nikhil/yt/utils/**"
      - "app/src/main/kotlin/com/nikhil/yt/di/**"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/StorageSettings.kt"
      - "app/src/test/**"
      - "innertube/src/main/**"
      - "innertube/src/test/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/youtube-core-validation.yml"

permissions:
  contents: write

concurrency:
  group: youtube-core-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and build YouTube core
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply pending final audit cleanup
        if: github.event_name == 'pull_request' && github.head_ref == 'cleanup/capsule-player-only'
        shell: bash
        run: |
          set -euo pipefail

          legacy="app/src/main/kotlin/com/nikhil/yt/utils/YTPlayerUtils.kt"
          if [[ ! -f "$legacy" ]]; then
            echo "Final audit cleanup already applied."
            exit 0
          fi

          python3 <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/one-shot-audit-cleanup.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("          PY\n", start)
          block = workflow[start:end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in block.splitlines()
          )
          exec(compile(script, 'final_audit_cleanup.py', 'exec'))
          PY

          git diff --check
          git config user.name "vani-s"
          git config user.email "vanimusic6@gmail.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Cleanup produced no changes."
            exit 0
          fi

          git commit -m "Finish Capsule audit cleanup"
          git push origin HEAD:cleanup/capsule-player-only

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run YouTube core tests and debug build
        run: |
          gradle \
            :innertube:test \
            :app:testUniversalDebugUnitTest \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

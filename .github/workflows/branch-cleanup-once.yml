name: One-time Capsule branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup-once.yml

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'vanimusic6-sudo/capsule-MUSIC'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Delete only checked obsolete branch refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r branch expected; do
            [[ -n "$branch" ]] || continue
            case "$branch" in
              main|cleanup/capsule-player-only)
                echo "::error::Refusing to delete a retained branch"
                exit 1
                ;;
            esac
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$current" != "$expected" ]]; then
              echo "::error::Branch $branch moved since review; refusing destructive cleanup"
              exit 1
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted reviewed obsolete branch: $branch"
          done <<'REVIEWED_BRANCHES'
          automation/youtube-clients-bbc809a1161d 73a736da85c41964afac00154cb52a4873ff08c2
          automation/youtube-clients-c7fb478d21e9 515ebb06ef7eb21866b131f073763198e32a24e0
          capsule-branding-updater-cleanup fc353fa033fb5bf732d4a75c2688881444281970
          capsule-video-newpipe-v2 768a4982884ccc630bf1b050650334254aacf02e
          ci/baseline-build 98914e749e8e09a2199e6a8f592a3127202e9b5e
          claude/navigation-cold-start-android16-iwvcdm b077aa903bdb6df701969fed042b2f47c977fe2b
          claude/youtube-music-403-errors-3otmk1 3db273d6bf165946d0fbb7240afbaf005b0f590d
          diagnostic/cdn-403-correlation-20260922 679dbfee5f83a71d45585df70091bd33e735059f
          feature/vision-first-web-remix-prewarm-20260923 e7205de8f597349092328003029dafcd187dc055
          fix/audio-cdn-tls-open-retry-20260922 34df0844c1e693fe8f4e19def9bd555c6a98ea57
          fix/library-and-request-safety aa0a2d2751a27be1574cddb39b8c42d57a7a749f
          test/cdn-follow-redirect-20260922 809e65dce8989b84194185c6a2b11c6cac1fe390
          REVIEWED_BRANCHES

          gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name'

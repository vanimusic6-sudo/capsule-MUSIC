name: Service Refactor Step 3

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/service-refactor-step3.yml"
      - "tools/refactor/extract_video_stream_guard.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-refactor-step3
  cancel-in-progress: false

jobs:
  integrate:
    name: Centralize VIDEO stream guard outside MusicService
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Verify VIDEO extraction preconditions
        run: python3 tools/refactor/extract_video_stream_guard.py --check

      - name: Extract VIDEO stream guard
        run: python3 tools/refactor/extract_video_stream_guard.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          INTERCEPTOR="app/src/main/kotlin/com/nikhil/yt/playback/video/CapsuleVideoStreamInterceptor.kt"

          git add -N "$INTERCEPTOR"
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$SERVICE" "$INTERCEPTOR" | sort)"
          test "$actual" = "$expected" || {
            echo "Unexpected transform diff:"
            printf '%s\n' "$actual"
            exit 1
          }

          grep -Fq 'CapsuleVideoRequestGuard.isBlocked()' "$SERVICE"
          grep -Fq 'CapsuleVideoStreamInterceptor()' "$SERVICE"
          grep -Fq 'CapsuleVideoRequestGuard.beforeStreamProbe()' "$INTERCEPTOR"
          grep -Fq 'CapsuleVideoRequestGuard.noteStreamStatus(response.code)' "$INTERCEPTOR"
          ! grep -Fq 'videoRequestBackoffUntilMs' "$SERVICE"
          ! grep -Fq 'maybeOpenVideoCircuitBreaker' "$SERVICE"
          ! grep -Fq 'Presence manager started with token' "$SERVICE"
          git diff --check

      - name: Run unit tests, lint and debug build
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit validated VIDEO guard extraction
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          INTERCEPTOR="app/src/main/kotlin/com/nikhil/yt/playback/video/CapsuleVideoStreamInterceptor.kt"
          git clean -f app/src/main/res/resources.properties || true
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$SERVICE" "$INTERCEPTOR" | sort)"
          test "$actual" = "$expected"
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$SERVICE" "$INTERCEPTOR"
          git commit -m "Centralize video stream request guard"
          git push origin HEAD:cleanup/capsule-player-only

name: Metrolist CDN Recovery Step 47

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - 'tools/refactor/metrolist_cdn_recovery_step47.py'
      - '.github/workflows/metrolist-cdn-recovery-step47.yml'

permissions:
  contents: write

concurrency:
  group: metrolist-cdn-recovery-step47
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    name: Apply, validate and commit Metrolist-style CDN recovery
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Capture base head
        shell: bash
        run: echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-read-only: true

      - name: Apply step47
        run: python3 tools/refactor/metrolist_cdn_recovery_step47.py

      - name: Verify recovery shape
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'CapsuleAudioEngine.markStreamClientFailed(' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -F 'httpStatusCode in setOf(403, 410)' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -F 'bundle().cipherService.refreshAfterStreamRejection()' app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayer.kt
          if grep -R -F 'refreshSameVisitorSession' app/src/main/kotlin/com/nikhil/yt/playback/audio; then
            echo 'forced PoToken session refresh still exists'
            exit 1
          fi
          grep -F 'rejectedPrimaryIsSkippedForOnlyThatTracksFreshResolve' app/src/test/kotlin/com/nikhil/yt/playback/audio/CapsuleAudioFallbackPolicyTest.kt
          git diff --check

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run full core validation
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-step47-universal-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Refuse stale write
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/cleanup/capsule-player-only | cut -f1)"
          if [ "$REMOTE_HEAD" != "$BASE_HEAD" ]; then
            echo "Branch moved during validation: base=$BASE_HEAD remote=$REMOTE_HEAD"
            exit 1
          fi

      - name: Commit validated step47
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/refactor/metrolist_cdn_recovery_step47.py
          rm -f .github/workflows/metrolist-cdn-recovery-step47.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Align CDN rejection recovery with Metrolist [step47-final]"
          git push origin HEAD:cleanup/capsule-player-only

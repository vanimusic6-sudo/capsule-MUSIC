name: Capsule Actions History Cleanup (one-time)

# Conservative cleanup of obsolete CI history. Does not touch releases, source
# code, repositories, or workflows. Self-removal after the run keeps Actions tidy.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capsule-actions-history-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: capsule-one-time-history-cleanup
  cancel-in-progress: false

jobs:
  remove-obsolete-runs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prune retired, cancelled, and old duplicate workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import collections
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          current = int(os.environ["CURRENT_RUN_ID"])
          now = dt.datetime.now(dt.timezone.utc)
          removed_names = {
              "Capsule Authenticated Download Regression",
              "Core reliability",
              "Experimental Debug APK (fast)",
              "Capsule Detail Motion / Scroll Regression",
              "Capsule Playback Experiment Validation",
              "Playback UI baseline comparison",
              "Post-test full regression comparison",
              "Capsule Release UI Polish Regression",
              "Capsule YouTube Video Selection Regression",
          }
          protect_names = {"Release APK", "Capsule Security Audit"}
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "capsule-ci-history-cleanup",
          }
          def request(method, path):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + path,
                  headers=headers,
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=35) as response:
                  data = response.read()
                  return json.loads(data) if data else None

          # Snapshot all run IDs before deletions; deleting during pagination would
          # otherwise shift the list and silently skip records.
          all_runs = []
          for page in range(1, 151):
              payload = request("GET", "/actions/runs?per_page=100&page=" + str(page))
              batch = payload.get("workflow_runs", [])
              if not batch:
                  break
              all_runs.extend(batch)
              if len(batch) < 100:
                  break
          print("Discovered", len(all_runs), "workflow runs", flush=True)

          # Always retain recent builds, the last five successful results for
          # every workflow, release/signing history, and security audit results.
          successful_kept = collections.Counter()
          candidates = []
          for run in all_runs:
              if run["id"] == current or run.get("status") != "completed":
                  continue
              name = run.get("name") or ""
              conclusion = run.get("conclusion")
              if name in protect_names or run.get("head_branch", "").startswith("release/"):
                  continue
              age_days = (
                  now - dt.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              ).total_seconds() / 86400.0
              if conclusion == "success":
                  successful_kept[name] += 1
                  if successful_kept[name] <= 5:
                      continue
              if age_days < 3:
                  continue

              priority = None
              if name in removed_names and age_days >= 7:
                  priority = 0
              elif conclusion in ("cancelled", "skipped", "timed_out", "stale") and age_days >= 3:
                  priority = 1
              elif conclusion == "failure" and age_days >= 14:
                  priority = 2
              elif conclusion == "success" and age_days >= 30:
                  priority = 3
              if priority is not None:
                  candidates.append((priority, -age_days, run["id"], name))

          candidates.sort()
          max_deletions = 900
          deleted = 0
          failed = 0
          categories = collections.Counter()
          for priority, _, run_id, name in candidates[:max_deletions]:
              try:
                  request("DELETE", "/actions/runs/" + str(run_id))
                  deleted += 1
                  categories[priority] += 1
              except urllib.error.HTTPError as exc:
                  failed += 1
                  print("Delete failed:", run_id, "HTTP", exc.code, flush=True)
                  if exc.code in (403, 429):
                      print("Stopping early to respect GitHub API rate limits.", flush=True)
                      break
                  if failed >= 10:
                      break
              if deleted % 50 == 0 and deleted:
                  print("Deleted", deleted, "of", len(candidates), "eligible old runs", flush=True)
              time.sleep(0.75)

          summary = ("Old runs inventoried: " + str(len(all_runs)) +
                     "\nEligible old runs: " + str(len(candidates)) +
                     "\nDeleted this pass: " + str(deleted) +
                     "\nPreserved: release/security workflows, recent runs, five newest successes per workflow.")
          print(summary, flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## Capsule CI history cleanup\n\n" + summary.replace("\n", "  \n") + "\n")
          if deleted == 0 and failed:
              raise SystemExit("Could not delete old runs with the available Actions token")
          PY

name: Final Field Test Cleanup Step 31

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/final-field-test-cleanup-step31.yml"
      - "tools/refactor/final_field_test_cleanup_step31.py"

permissions:
  contents: write

concurrency:
  group: final-field-test-cleanup-step31
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Verify patch preconditions
        run: python3 tools/refactor/final_field_test_cleanup_step31.py --check

      - name: Apply field-test cleanup
        run: python3 tools/refactor/final_field_test_cleanup_step31.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          DOWNLOAD=app/src/main/kotlin/com/nikhil/yt/playback/DownloadUtil.kt
          SCHED=app/src/main/kotlin/com/nikhil/yt/playback/audio/AudioResolveScheduler.kt
          SCHED_TEST=app/src/test/kotlin/com/nikhil/yt/playback/audio/AudioResolveSchedulerTest.kt
          SYNC=app/src/main/kotlin/com/nikhil/yt/utils/SyncUtils.kt
          VM=app/src/main/kotlin/com/nikhil/yt/viewmodels/LibraryViewModels.kt
          MIX=app/src/main/kotlin/com/nikhil/yt/ui/screens/library/LibraryMixScreen.kt

          test "$(git diff --name-only | wc -l | tr -d ' ')" = "6"
          for file in "$DOWNLOAD" "$SCHED" "$SCHED_TEST" "$SYNC" "$VM" "$MIX"; do
            git diff --name-only | grep -Fxq "$file"
          done

          ! grep -Fq 'lastDownloadResolveStartMs' "$DOWNLOAD"
          ! grep -Fq 'DOWNLOAD_RESOLVE_SPACING_MS' "$DOWNLOAD"
          grep -Fq 'DOWNLOAD_START_SPACING_MS = 4_000L' "$SCHED"
          grep -Fq 'awaitDownloadStartWindow(ticket.priority)' "$SCHED"
          grep -Fq 'downloadRestartAfterPreemptionKeepsActualStartSpacing' "$SCHED_TEST"
          grep -Fq 'suspend fun performFullSync(automatic: Boolean = false)' "$SYNC"
          grep -Fq 'syncLikedAlbums(automatic = automatic)' "$SYNC"
          grep -Fq 'syncArtistsSubscriptions(automatic = automatic)' "$SYNC"
          grep -Fq 'fun syncAllLibrary(automatic: Boolean = false)' "$VM"
          grep -Fq 'performFullSync(automatic = automatic)' "$VM"
          grep -Fq 'syncAllLibrary(automatic = true)' "$MIX"
          git diff --check

      - name: Run full validation
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit validated cleanup and remove temporary automation
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/final-field-test-cleanup-step31.yml
          git rm tools/refactor/final_field_test_cleanup_step31.py
          git add \
            app/src/main/kotlin/com/nikhil/yt/playback/DownloadUtil.kt \
            app/src/main/kotlin/com/nikhil/yt/playback/audio/AudioResolveScheduler.kt \
            app/src/test/kotlin/com/nikhil/yt/playback/audio/AudioResolveSchedulerTest.kt \
            app/src/main/kotlin/com/nikhil/yt/utils/SyncUtils.kt \
            app/src/main/kotlin/com/nikhil/yt/viewmodels/LibraryViewModels.kt \
            app/src/main/kotlin/com/nikhil/yt/ui/screens/library/LibraryMixScreen.kt
          git commit -m "Fix final download pacing and automatic library sync gaps"
          git push origin HEAD:cleanup/capsule-player-only

name: Capsule YouTube Video Selection Regression
on:
  push:
    branches: ['fix/youtube-video-selection-stability-20261104']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Prepare compile SDK and locale
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1'
          echo 'unqualifiedResLocale=en-US' > app/src/main/res/resources.properties
      - name: Verify playback queue identity
        run: |
          gradle :app:testUniversalDebugUnitTest \
            --tests 'com.nikhil.yt.playback.queues.YouTubeQueueSelectionTest' \
            --tests 'com.nikhil.yt.playback.OfflinePlaybackQueueTest' \
            --tests 'com.nikhil.yt.playback.AudioPrefetchSchedulingTest' \
            --stacktrace --no-daemon --max-workers=2

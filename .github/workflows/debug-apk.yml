name: Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - cleanup/capsule-player-only
      - next/capsule-clay
      - perf/thermal-audit-20261005
      - feature/video-isolated-thermal-20261010-v2
      - fix/video-stable-incremental-20261011
      - refactor/video-session-rebuild-20261011
      - fix/video-state-audio-maintenance-20261014
      - polish/video-immersion-jelly-audio-cdn-20261014
      - polish/velocity-sticky-video-20261014
      - fix/video-consistent-width-soft-corners-20261014
      - fix/immersion-close-artwork-energy-20261014
      - fix/video-cover-stability-independent-size-20261014
      - fix/video-dissolve-opaque-cover-20261015
      - polish/lyrics-menu-motion-20261015
      - polish/lyrics-jelly-menu-gestures-immersion-seam-20261015
      - fix/original-more-jelly-smooth-lyrics-20261015
      - fix/predictive-back-and-lyrics-transition-20261015
      - polish/motion-sheet-lyrics-60hz-20261015
      - polish/lyrics-aperture-morph-20261015
      - polish/lyrics-ink-immersion-true-edge-20261015
      - fix/immersive-smoked-gradient-lyrics-fog-20261016
      - fix/immersion-soft-staged-shading-static-ink-20261016
      - fix/immersion-clean-photo-to-ink-20261016
      - fix/immersion-continuous-photo-to-floor-20261016
      - fix/immersion-return-sampled-muted-colour-20261016
      - fix/immersion-restore-original-white-soft-only-20261016
      - audit/global-motion-physics-energy-20261017
      - feature/settings-motion-physics-20261017
      - feature/settings-motion-v2-20261017
      - fix/settings-motion-recording-9467-20261017
      - fix/settings-header-motion-smooth-energy-20261017
      - fix/settings-motion-header-standalone-20261017
      - fix/video-timeline-morph-20261014

permissions:
  contents: read

concurrency:
  group: capsule-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Universal Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Prepare locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run Android lint
        run: |
          gradle :app:verifyAndroidJsonRuntime :app:lintUniversalDebug --stacktrace --no-daemon

      - name: Upload Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-lint-reports
          path: |
            app/build/reports/lint-results-universalDebug.*
            app/build/intermediates/lint_intermediate_text_report/universalDebug/lintReportUniversalDebug/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Test TASK 04 existing theme modes and preference persistence
        run: |
          gradle :app:testUniversalDebugUnitTest \
            --tests 'com.nikhil.yt.ui.theme.CapsuleThemeModeTest' \
            --tests 'com.nikhil.yt.ui.theme.CapsuleThemeBackgroundTest' \
            --tests 'com.nikhil.yt.utils.PreferenceInitialValueTest' \
            --stacktrace --no-daemon

      - name: Test TASK 05 home clock, guest icon, scroll header and Capsule Light
        run: |
          gradle :app:testUniversalDebugUnitTest \
            --tests 'com.nikhil.yt.ui.component.HomeDayPeriodTest' \
            --tests 'com.nikhil.yt.ui.component.HomeGuestIconTest' \
            --tests 'com.nikhil.yt.ui.HomeScrollableHeaderTest' \
            --tests 'com.nikhil.yt.ui.theme.CapsuleLightPaletteTest' \
            --tests 'com.nikhil.yt.ui.theme.CapsuleThemeModeTest' \
            --stacktrace --no-daemon

      - name: Test TASK 06 release defaults and saved preference priority
        run: |
          gradle :app:testUniversalDebugUnitTest \
            --tests 'com.nikhil.yt.constants.ReleaseDefaultsTest' \
            --tests 'com.nikhil.yt.constants.AudioClientOrderTest' \
            --tests 'com.nikhil.yt.ui.LyricsProviderOrderTest' \
            --stacktrace --no-daemon

      - name: Test TASK 07 settings cleanup, modes and saved preferences
        run: |
          gradle :app:testUniversalDebugUnitTest \
            --tests 'com.nikhil.yt.ui.screens.settings.SettingsModeRegressionTest' \
            --stacktrace --no-daemon

      - name: Test TASK 02 Home and artwork regressions
        run: |
          gradle :app:testUniversalDebugUnitTest \
            --tests 'com.nikhil.yt.ui.HomePerformanceRegressionTest' \
            --tests 'com.nikhil.yt.ui.player.PlayerArtworkReliabilityTest' \
            --tests 'com.nikhil.yt.ui.player.ImmersiveVideoArtworkClipRegressionTest' \
            --tests 'com.nikhil.yt.ui.component.MiniPlayerGestureArbiterTest' \
            --tests 'com.nikhil.yt.ui.component.SquareArtworkCropTest' \
            --stacktrace --no-daemon

      - name: Test player transition and energy regressions
        run: |
          gradle :app:testUniversalDebugUnitTest \
            --tests 'com.nikhil.yt.lyrics.InstrumentalLyricsTest' \
            --tests 'com.nikhil.yt.ui.BottomSheetAnchorTest' \
            --tests 'com.nikhil.yt.ui.DockHandoverTest' \
            --tests 'com.nikhil.yt.ui.PlayerTransitionGestureTest' \
            --tests 'com.nikhil.yt.ui.CapsuleFavoriteAnimationTest' \
            --tests 'com.nikhil.yt.ui.PlayerMenuGestureTest' \
            --tests 'com.nikhil.yt.ui.CapsuleMenuMotionTest' \
            --tests 'com.nikhil.yt.ui.PlayerTransitionArchitectureTest' \
            --tests 'com.nikhil.yt.ui.player.CapsuleLyricsSpringMotionTest' \
            --tests 'com.nikhil.yt.ui.MiniPlayerSwipeMotionTest' \
            --tests 'com.nikhil.yt.ui.CapsuleBackgroundMotionTest' \
            --tests 'com.nikhil.yt.playback.CrossfadeIdlePollTest' \
            --tests 'com.nikhil.yt.ui.UiEnergyRegressionTest' \
            --tests 'com.nikhil.yt.ui.MotionEnergyStructuralRegressionTest' \
          --tests 'com.nikhil.yt.ui.ScreenTransitionsTest' \
            --tests 'com.nikhil.yt.ui.player.CapsuleVideoArtworkTransitionTest' \
            --tests 'com.nikhil.yt.ui.player.CapsuleImmersiveContentTest' \
            --tests 'com.nikhil.yt.ui.player.ImmersiveArtworkBackgroundTest' \
            --tests 'com.nikhil.yt.ui.player.CapsuleVideoMorphPixelsTest' \
            --tests 'com.nikhil.yt.ui.player.CapsuleVideoViewportTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoPlayerLifecycleTest' \
            --tests 'com.nikhil.yt.models.MediaMetadataArtistMergeTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoResolveCoordinatorTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoSingleFlightTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoModeRequestTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoRemoteClientTest' \
            --tests 'com.nikhil.yt.playback.video.CancellableRemoteCallTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoChunkedDataSourceTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoWarmupTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoCompanionTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoSessionTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoTimelinePolicyTest' \
            --tests 'com.nikhil.yt.playback.audio.AudioCdnHostHealthTest' \
            --tests 'com.nikhil.yt.playback.audio.AudioChunkedDataSourceTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoFrameRetentionTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleHlsPlaylistParserFactoryTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoIndexedDashTest' \
            --tests 'com.nikhil.yt.playback.video.CapsuleVideoDirectMediaSourceFactoryTest' \
            --tests 'com.nikhil.yt.playback.video.VideoStreamCacheTest' \
            --stacktrace --no-daemon

      - name: Upload video regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-video-regression-evidence
          path: |
            app/build/video-morph-preview/*.png
            app/build/test-results/testUniversalDebugUnitTest/*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Test search summary metadata
        run: |
          gradle :kizzy:test --stacktrace --no-daemon
          gradle :innertube:test \
            --tests 'com.nikhil.yt.innertube.pages.SearchSummaryMetadataTest' \
            --tests 'com.nikhil.yt.innertube.pages.PageHelperArtistCreditsTest' \
            --stacktrace --no-daemon

      - name: Test VIDEO quality, clip matching and podcast classification
        run: |
          gradle :innertube:test \
            --tests 'com.nikhil.yt.innertube.YouTubeMusicVideoMatcherTest' \
            --tests 'com.nikhil.yt.innertube.ExplicitVideoOriginTest' \
            --tests 'com.nikhil.yt.innertube.video.CapsuleNewPipeExtractorTest' \
            --tests 'com.nikhil.yt.innertube.video.CapsulePipePipeTransportTest' \
            --tests 'com.nikhil.yt.innertube.video.CapsuleDashManifestTest' \
            --tests 'com.nikhil.yt.innertube.video.CapsuleDirectVideoExtractorTest' \
            --tests 'com.nikhil.yt.innertube.video.CapsuleVideoRoutesTest' \
            --tests 'com.nikhil.yt.innertube.video.VideoExtractionRequestsTest' \
            --tests 'com.nikhil.yt.innertube.CapsuleVideoRequestGuardTest' \
            --tests 'com.nikhil.yt.innertube.CapsuleVideoMetadataAdmissionTest' \
            --stacktrace --no-daemon

      - name: Build Universal Debug APK
        # Build and retain the APK even when an unrelated existing regression test fails.
        # The job still reports that test failure instead of concealing it.
        if: success() || failure()
        run: |
          gradle :app:assembleUniversalDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        # Build and retain the APK even when an unrelated existing regression test fails.
        # The job still reports that test failure instead of concealing it.
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: capsule-universal-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14

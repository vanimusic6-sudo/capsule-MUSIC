name: Service Refactor Step 9

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/service-refactor-step9.yml"
      - "tools/refactor/extract_playback_audio_effects_controller.py"
      - "app/src/main/kotlin/com/nikhil/yt/playback/PlaybackAudioEffectsController.kt"
      - "app/src/test/kotlin/com/nikhil/yt/playback/PlaybackAudioEffectsControllerTest.kt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-refactor-step9
  cancel-in-progress: false

jobs:
  integrate:
    name: Extract inherited audio effects runtime
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Verify audio-effects extraction preconditions
        run: python3 tools/refactor/extract_playback_audio_effects_controller.py --check

      - name: Extract audio-effects runtime ownership
        run: python3 tools/refactor/extract_playback_audio_effects_controller.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only)"
          test "$changed" = "$SERVICE"
          ! grep -Fq 'import android.media.audiofx.BassBoost' "$SERVICE"
          ! grep -Fq 'import android.media.audiofx.Equalizer' "$SERVICE"
          ! grep -Fq 'import android.media.audiofx.LoudnessEnhancer' "$SERVICE"
          ! grep -Fq 'import android.media.audiofx.Virtualizer' "$SERVICE"
          ! grep -Fq 'private var audioEffectsSessionId' "$SERVICE"
          ! grep -Fq 'private var equalizer:' "$SERVICE"
          ! grep -Fq 'private var bassBoost:' "$SERVICE"
          ! grep -Fq 'private var virtualizer:' "$SERVICE"
          ! grep -Fq 'private var loudnessEnhancer:' "$SERVICE"
          ! grep -Fq 'desiredEqSettings' "$SERVICE"
          ! grep -Fq 'private fun releaseAudioEffects' "$SERVICE"
          ! grep -Fq 'private fun ensureAudioEffects' "$SERVICE"
          ! grep -Fq 'private fun applyEqSettingsToEffects' "$SERVICE"
          grep -Fq 'private val audioEffectsController =' "$SERVICE"
          grep -Fq 'val eqCapabilities = audioEffectsController.capabilities' "$SERVICE"
          grep -Fq 'audioEffectsController.applySettings(settings)' "$SERVICE"
          grep -Fq 'audioEffectsController.applySystemPreset(' "$SERVICE"
          test "$(grep -Fc 'audioEffectsController.release()' "$SERVICE")" = "2"
          grep -Fq 'import android.media.audiofx.AudioEffect' "$SERVICE"
          git diff --check

      - name: Run unit tests, lint and debug build
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit validated audio-effects extraction
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only)"
          test "$changed" = "$SERVICE"
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$SERVICE"
          git commit -m "Move audio effects runtime out of MusicService"
          git push origin HEAD:cleanup/capsule-player-only

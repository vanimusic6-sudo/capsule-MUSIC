name: Capsule Player UI Quality

# Reusable quality gate for player skin, motion and gesture changes.
on:
  pull_request:
    paths:
      - 'app/src/main/kotlin/com/nikhil/yt/ui/player/**'
      - 'app/src/test/kotlin/com/nikhil/yt/ui/**'
      - '.github/workflows/player-ui-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: player-ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-player:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Prepare Android SDK and locale metadata
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "$SDKMANAGER" ]]; then
            "$SDKMANAGER" 'platforms;android-37.1'
          fi
          echo 'unqualifiedResLocale=en-US' > app/src/main/res/resources.properties
      - name: Player gesture, motion, background and video regressions
        run: >-
          gradle :app:testUniversalDebugUnitTest
          --tests 'com.nikhil.yt.ui.CapsuleBackgroundMotionTest'
          --tests 'com.nikhil.yt.ui.player.CapsuleBackgroundClockTest'
          --tests 'com.nikhil.yt.ui.player.CapsuleColorFieldTest'
          --tests 'com.nikhil.yt.ui.player.CapsuleScenePaletteTest'
          --tests 'com.nikhil.yt.ui.player.CapsuleImmersiveFieldTest'
          --tests 'com.nikhil.yt.ui.player.CapsuleImmersiveTailTest'
          --tests 'com.nikhil.yt.ui.player.CapsuleVideoAmbientTest'
          --tests 'com.nikhil.yt.ui.player.CapsuleVideoAmbientResumeTest'
          --tests 'com.nikhil.yt.ui.player.ImmersiveArtworkBackgroundTest'
          --tests 'com.nikhil.yt.ui.CapsuleMotionTest'
          --tests 'com.nikhil.yt.ui.PlayerTransitionGestureTest'
          --tests 'com.nikhil.yt.ui.PlayerTransitionArchitectureTest'
          --tests 'com.nikhil.yt.ui.SearchPresentationRegressionTest'
          --tests 'com.nikhil.yt.ui.SearchBarInsetTest'
          --tests 'com.nikhil.yt.ui.player.PlayerArtworkReliabilityTest'
          --tests 'com.nikhil.yt.ui.MiniPlayerSwipeMotionTest'
          --tests 'com.nikhil.yt.ui.player.CapsuleVideoArtworkTransitionTest'
          --tests 'com.nikhil.yt.ui.player.CapsuleVideoMorphPixelsTest'
          --tests 'com.nikhil.yt.ui.player.CapsuleImmersiveContentTest'
          --tests 'com.nikhil.yt.ui.player.CapsuleLightEditorTest'
          --tests 'com.nikhil.yt.ui.player.CapsuleDesignPresetTest'
          --tests 'com.nikhil.yt.ui.MotionEnergyStructuralRegressionTest'
          --tests 'com.nikhil.yt.ui.UiEnergyRegressionTest'
          --stacktrace --no-daemon --max-workers=2
      - name: Android lint
        run: gradle :app:lintUniversalDebug --no-daemon --max-workers=2
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-ui-quality-reports
          path: |
            app/build/test-results/testUniversalDebugUnitTest/
            app/build/reports/tests/testUniversalDebugUnitTest/
            app/build/reports/lint-results-universalDebug.*
          if-no-files-found: warn
          retention-days: 7

# Final step39 validation marker; no validation behavior changed.
name: YouTube Core Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/kotlin/com/nikhil/yt/ui/**"
      - "app/src/main/kotlin/com/nikhil/yt/MainActivity.kt"
      - "app/src/main/res/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/kotlin/com/nikhil/yt/playback/**"
      - "app/src/main/kotlin/com/nikhil/yt/extensions/**"
      - "app/src/main/kotlin/com/nikhil/yt/utils/**"
      - "app/src/main/kotlin/com/nikhil/yt/di/**"
      - "app/src/main/kotlin/com/nikhil/yt/db/**"
      - "app/build.gradle.kts"
      - "innertube/build.gradle.kts"
      - "app/src/main/kotlin/com/nikhil/yt/App.kt"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/StorageSettings.kt"
      - "app/src/test/**"
      - "app/src/main/kotlin/com/nikhil/yt/lyrics/**"
      - "betterlyrics/**"
      - "lrclib/**"
      - "innertube/src/main/**"
      - "innertube/src/test/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/youtube-core-validation.yml"
  push:
    branches:
      - main
      - cleanup/capsule-player-only
    paths:
      - "app/src/main/kotlin/com/nikhil/yt/ui/**"
      - "app/src/main/kotlin/com/nikhil/yt/MainActivity.kt"
      - "app/src/main/res/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/kotlin/com/nikhil/yt/playback/**"
      - "app/src/main/kotlin/com/nikhil/yt/extensions/**"
      - "app/src/main/kotlin/com/nikhil/yt/utils/**"
      - "app/src/main/kotlin/com/nikhil/yt/di/**"
      - "app/src/main/kotlin/com/nikhil/yt/db/**"
      - "app/build.gradle.kts"
      - "innertube/build.gradle.kts"
      - "app/src/main/kotlin/com/nikhil/yt/App.kt"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt"
      - "app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/StorageSettings.kt"
      - "app/src/test/**"
      - "app/src/main/kotlin/com/nikhil/yt/lyrics/**"
      - "betterlyrics/**"
      - "lrclib/**"
      - "innertube/src/main/**"
      - "innertube/src/test/**"
      - "gradle/libs.versions.toml"
      - "gradle/wrapper/gradle-wrapper.properties"
      - ".github/workflows/youtube-core-validation.yml"

permissions:
  contents: read

concurrency:
  group: youtube-core-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and build YouTube core
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run YouTube core tests, lint and debug build
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :lrclib:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:lintVitalUniversalRelease \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-core-validation-reports
          path: |
            innertube/build/reports/tests/
            betterlyrics/build/reports/tests/
            lrclib/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/ui-previews/
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare validated APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/build/validated
          cp app/build/outputs/apk/universal/debug/app-universal-debug.apk \
            app/build/validated/capsule-music-universal-debug.apk
          sha256sum app/build/validated/capsule-music-universal-debug.apk \
            > app/build/validated/SHA256SUMS.txt

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-music-universal-debug
          path: app/build/validated/
          if-no-files-found: error
          retention-days: 14

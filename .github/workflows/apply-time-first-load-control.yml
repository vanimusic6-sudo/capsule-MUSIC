name: Apply time-first load control

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - .github/workflows/apply-time-first-load-control.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Patch both audio ExoPlayer builders
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt")
          text = path.read_text(encoding="utf-8")
          marker = ".setMediaSourceFactory(createMediaSourceFactory())"
          if text.count(marker) != 2:
              raise SystemExit(f"expected exactly 2 audio builders, found {text.count(marker)}")
          if ".setLoadControl(createCapsuleLoadControl())" in text:
              raise SystemExit("load control already wired")

          text = text.replace(
              marker,
              marker + "\n                .setLoadControl(createCapsuleLoadControl())",
          )
          path.write_text(text, encoding="utf-8")

      - name: Verify patch
        run: |
          test "$(grep -c 'setLoadControl(createCapsuleLoadControl())' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt)" -eq 2
          grep -q 'CAPSULE_MIN_BUFFER_MS = 50_000' app/src/main/kotlin/com/nikhil/yt/playback/CapsuleLoadControl.kt
          grep -q 'CAPSULE_MAX_BUFFER_MS = 50_000' app/src/main/kotlin/com/nikhil/yt/playback/CapsuleLoadControl.kt
          grep -q 'CAPSULE_BUFFER_FOR_PLAYBACK_MS = 750' app/src/main/kotlin/com/nikhil/yt/playback/CapsuleLoadControl.kt
          grep -q 'CAPSULE_BUFFER_FOR_PLAYBACK_AFTER_REBUFFER_MS = 2_000' app/src/main/kotlin/com/nikhil/yt/playback/CapsuleLoadControl.kt
          ! grep -q 'setPrioritizeTimeOverSizeThresholds' app/src/main/kotlin/com/nikhil/yt/playback/CapsuleLoadControl.kt

      - name: Compile both debug variants
        run: ./gradlew :app:compileUniversalDebugKotlin :app:compileArmeabiDebugKotlin --stacktrace

      - name: Commit production wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          git diff --cached --check
          git commit -m "Prevent late audio CDN refill underruns"
          git push origin HEAD:cleanup/capsule-player-only

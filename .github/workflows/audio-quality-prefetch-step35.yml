name: Audio Quality And Prefetch Step 35

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/audio-quality-prefetch-step35.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audio-quality-prefetch-step35
  cancel-in-progress: false

jobs:
  patch-test-and-push:
    if: github.actor != 'github-actions[bot]'
    name: Remove duplicate max quality and harden foreground resolve
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Apply guarded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/refactor/fix_audio_quality_prefetch_step35.py --check
          python3 tools/refactor/fix_audio_quality_prefetch_step35.py
          git diff --check

          ! grep -Fq 'stringResource(R.string.audio_quality_max)' app/src/main/kotlin/com/nikhil/yt/ui/screens/settings/PlayerSettings.kt
          grep -Fq 'AudioQuality.HIGHEST) AudioQuality.HIGH' app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt
          grep -Fq 'promotedPrefetchRestartAfterMs' app/src/main/kotlin/com/nikhil/yt/playback/audio/AudioResolveScheduler.kt
          grep -Fq 'stalePrefetchPromotionRestartsAsForeground' app/src/test/kotlin/com/nikhil/yt/playback/audio/AudioResolveSchedulerTest.kt

      - name: Full validation
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-step35-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit final source and remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          rm -f tools/refactor/fix_audio_quality_prefetch_step35.py
          rm -f .github/workflows/audio-quality-prefetch-step35.yml
          git diff --check
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix duplicate max quality and foreground resolve stalls [step35-final]"
          git push origin HEAD:cleanup/capsule-player-only

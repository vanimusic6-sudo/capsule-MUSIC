name: Capsule Authenticated Download Regression

on:
  push:
    branches: ['fix/authenticated-downloads-20261104']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capsule-auth-download-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-download-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Prepare compile SDK and locale
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.1'
          echo 'unqualifiedResLocale=en-US' > app/src/main/res/resources.properties
      - name: Test account-aware download fallback, cache and refusal policy
        run: |
          gradle :app:testUniversalDebugUnitTest \
            --tests 'com.nikhil.yt.playback.audio.DownloadIsolationTest' \
            --tests 'com.nikhil.yt.playback.audio.PlaybackDataCacheTest' \
            --tests 'com.nikhil.yt.playback.DownloadResolveFailureClassificationTest' \
            --stacktrace --no-daemon --max-workers=2

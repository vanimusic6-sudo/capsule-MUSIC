name: Service Refactor Step 7

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/service-refactor-step7.yml"
      - "tools/refactor/use_together_build_token.py"
      - "app/src/main/kotlin/com/nikhil/yt/together/TogetherOnlineCredentials.kt"
      - "app/src/test/kotlin/com/nikhil/yt/together/TogetherOnlineCredentialsTest.kt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: service-refactor-step7
  cancel-in-progress: false

jobs:
  integrate:
    name: Use one configured Together online bearer
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Verify Together credential wiring preconditions
        run: python3 tools/refactor/use_together_build_token.py --check

      - name: Use configured Together bearer
        run: python3 tools/refactor/use_together_build_token.py

      - name: Verify structural result
        shell: bash
        run: |
          set -euo pipefail
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only)"
          test "$changed" = "$SERVICE"
          ! grep -Fq '"VeluneAdminToken"' "$SERVICE"
          ! grep -Fq '"velune_server_token"' "$SERVICE"
          grep -Fq 'import com.nikhil.yt.together.TogetherOnlineCredentials' "$SERVICE"
          test "$(grep -Fc 'TogetherOnlineCredentials.bearerTokenOrNull()' "$SERVICE")" = "2"
          test "$(grep -Fc 'if (togetherToken == null)' "$SERVICE")" -ge "2"
          grep -Fq 'buildConfigField("String", "TOGETHER_BEARER_TOKEN"' app/build.gradle.kts
          git diff --check

      - name: Run unit tests, lint and debug build
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit validated Together credential wiring
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          SERVICE="app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt"
          changed="$(git diff --name-only)"
          test "$changed" = "$SERVICE"
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$SERVICE"
          git commit -m "Use configured Together online bearer"
          git push origin HEAD:cleanup/capsule-player-only

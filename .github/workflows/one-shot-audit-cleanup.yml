          if malformed_task in text:
              text = text.replace(malformed_task, formatted_task, 1)

          write(path, text)

          # --- H-3 + M-3: rethrow coroutine cancellation and never swallow an empty catch silently. ---
          def harden_catches(path: Path, harden_general_exception: bool):
              text = read(path)
              tag = path.stem

              # Empty catches first: keep best-effort behavior, but leave a trace.
              empty = re.compile(r'catch\s*\(\s*_\s*:\s*([A-Za-z0-9_.]+)\s*\)\s*\{\s*\}')
              def empty_repl(match):
                  typ = match.group(1)
                  cancellation = ''
                  if typ == 'Exception' or typ.endswith('.Exception'):
                      cancellation = ' if (error is kotlinx.coroutines.CancellationException) throw error;'
                  return (
                      f'catch (error: {typ}) {{{cancellation} '
                      f'timber.log.Timber.tag("{tag}").w(error, "Best-effort operation failed") }}'
                  )
              text = empty.sub(empty_repl, text)

              if harden_general_exception:
                  text = text.replace('catch (_: Exception)', 'catch (error: Exception)')
                  opening = re.compile(r'catch\s*\(\s*([A-Za-z][A-Za-z0-9_]*)\s*:\s*Exception\s*\)\s*\{')
                  cursor = 0
                  out = []
                  for match in opening.finditer(text):
                      out.append(text[cursor:match.end()])
                      name = match.group(1)
                      following = text[match.end():match.end() + 180]
                      if (
                          f'{name} is kotlinx.coroutines.CancellationException' not in following
                          and f'{name} is CancellationException' not in following
                      ):
                          out.append(
                              f' if ({name} is kotlinx.coroutines.CancellationException) throw {name};'
                          )
                      cursor = match.end()
                  out.append(text[cursor:])
                  text = ''.join(out)

              write(path, text)

          for kt in Path('app/src/main/kotlin').rglob('*.kt'):
              harden = (
                  kt.name == 'MusicService.kt'
                  or '/viewmodels/' in kt.as_posix()
                  or '/playback/audio/' in kt.as_posix()
              )
              harden_catches(kt, harden)

          # --- L-1: release notes and Discord defaults belong to Capsule, not upstream Velune. ---
          path = Path('app/src/main/kotlin/com/nikhil/yt/ui/component/ReleaseNotesCard.kt')
          text = read(path)
          for old in [
              'import android.util.Log\n',

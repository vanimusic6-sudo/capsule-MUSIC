name: CDN Quarantine Preservation Step 48

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - 'tools/refactor/cdn_quarantine_step48.py'
      - '.github/workflows/cdn-quarantine-step48.yml'

permissions:
  contents: write

concurrency:
  group: cdn-quarantine-step48
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    name: Preserve rejected-client quarantine through cipher refresh
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0

      - name: Capture base head
        shell: bash
        run: echo "BASE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-read-only: true

      - name: Apply step48
        run: python3 tools/refactor/cdn_quarantine_step48.py

      - name: Verify recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          SERVICE='app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt'
          TEST='app/src/test/kotlin/com/nikhil/yt/playback/CdnRecoveryPolicyTest.kt'

          grep -F 'SIGNED_URL_CIPHER_REFRESH_THRESHOLD_MS' "$SERVICE"
          grep -F 'shouldRefreshCipherConfigAfterSignedUrlRejection(' "$SERVICE"
          grep -F 'preserving per-song rejected-client quarantine' "$SERVICE"
          grep -F 'CapsuleAudioEngine.markStreamClientFailed(' "$SERVICE"
          grep -F 'rejectedSignedUrlRetryRemainsBounded' "$TEST"

          if grep -F 'SIGNED_URL_SESSION_REFRESH_THRESHOLD_MS' "$SERVICE"; then
            echo 'stale session-refresh constant survived'
            exit 1
          fi
          if grep -F 'shouldRefreshStreamSessionAfterSignedUrlRejection' "$SERVICE"; then
            echo 'stale session-refresh helper survived'
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          source = Path('app/src/main/kotlin/com/nikhil/yt/playback/MusicService.kt').read_text()
          marker = 'preserving per-song rejected-client quarantine'
          idx = source.index(marker)
          window = source[max(0, idx - 700): idx + 700]
          if 'clearStreamClientFailures()' in window:
              raise SystemExit('cipher refresh still erases rejected-client quarantine')
          if 'refreshSameVisitorSession' in source:
              raise SystemExit('forced visitor/BotGuard session rotation reappeared')
          PY

          git diff --check

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res
          cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF

      - name: Run full core validation
        run: |
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload validated debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-step48-universal-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Refuse stale write
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin refs/heads/cleanup/capsule-player-only | cut -f1)"
          if [ "$REMOTE_HEAD" != "$BASE_HEAD" ]; then
            echo "Branch moved during validation: base=$BASE_HEAD remote=$REMOTE_HEAD"
            exit 1
          fi

      - name: Commit validated step48
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/refactor/cdn_quarantine_step48.py
          rm -f .github/workflows/cdn-quarantine-step48.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve CDN client quarantine across cipher refresh [step48-final]"
          git push origin HEAD:cleanup/capsule-player-only

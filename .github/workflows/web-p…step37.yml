name: WEB PoToken Startup Prewarm Step 37

on:
  push:
    branches:
      - cleanup/capsule-player-only
    paths:
      - ".github/workflows/web-p…step37.yml"
      - "tools/refactor/prewarm_web_potoken_step37.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-p…step37
  cancel-in-progress: false

jobs:
  patch-test-and-push:
    if: github.actor != 'github-actions[bot]'
    name: Safe WEB PoToken startup prewarm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: cleanup/capsule-player-only
          fetch-depth: 0
          persist-credentials: true

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Ensure locale metadata
        shell: bash
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch app/src/main/res/resources.properties >/dev/null 2>&1; then
            mkdir -p app/src/main/res
            cat > app/src/main/res/resources.properties <<'EOF'
          unqualifiedResLocale=en-US
          EOF
          fi

      - name: Apply guarded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/refactor/prewarm_web_potoken_step37.py --check
          python3 tools/refactor/prewarm_web_potoken_step37.py
          git diff --check
          grep -Fq 'prewarmWebPoToken = startupPolicy == AudioStreamPolicy.WEB' app/src/main/kotlin/com/nikhil/yt/App.kt
          grep -Fq 'suspend fun prewarm(prewarmWebPoToken: Boolean = false)' app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayer.kt
          grep -Fq 'poTokenGenerator.prewarm(visitorData)' app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayer.kt
          grep -Fq 'It does not' app/src/main/kotlin/com/nikhil/yt/playback/audio/CapsuleInnerTubeXPlayer.kt

      - name: Full validation
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :innertube:test \
            :betterlyrics:test \
            :lrclib:test \
            :app:testUniversalDebugUnitTest \
            :app:lintUniversalDebug \
            :app:assembleUniversalDebug \
            --stacktrace \
            --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: capsule-step37-debug
          path: app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Refuse stale branch write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin cleanup/capsule-player-only
          remote_head="$(git rev-parse origin/cleanup/capsule-player-only)"
          test "$remote_head" = "$GITHUB_SHA" || {
            echo "Branch advanced during validation; refusing stale push."
            echo "workflow head: $GITHUB_SHA"
            echo "remote head:   $remote_head"
            exit 1
          }

      - name: Commit final source and remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git clean -f app/src/main/res/resources.properties || true
          rm -f tools/refactor/prewarm_web_potoken_step37.py
          rm -f .github/workflows/web-p…step37.yml
          git diff --check
          git config user.name "capsule-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Prewarm WEB PoToken session safely [step37-final]"
          git push origin HEAD:cleanup/capsule-player-only
